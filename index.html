{id:'d6a',level:'6e',title:'Le jardin secret',topic:'Accords',text:'Les petits oiseaux chantent dans le jardin. Une fleur rouge pousse près de la maison. Les enfants regardent les papillons.',explain:'Le sujet au pluriel commande souvent une terminaison verbale au pluriel.'},
{id:'d6b',level:'6e',title:'La bibliothèque',topic:'Lexique',text:'Chaque matin, Camille ouvre un grand livre. Elle découvre une histoire merveilleuse et dessine un château.',explain:'Observe les lettres doubles et les accents.'},
{id:'d5a',level:'5e',title:'Le voyage',topic:'Conjugaison',text:'Hier, nous avons visité un village ancien. Les habitants nous ont raconté des histoires étonnantes. Nous sommes rentrés heureux.',explain:'Attention aux auxiliaires et aux accords des participes passés.'},
{id:'d5b',level:'5e',title:'Une journée pluvieuse',topic:'Homophones',text:'À midi, Léa a fermé sa fenêtre. Ses amis sont restés chez elle et ont préparé un gâteau.',explain:'Distingue à et a, sont et son, ses et ces.'},
{id:'d4a',level:'4e',title:'La découverte',topic:'Accords',text:'Les exploratrices, surprises par la lumière, ont découvert une salle oubliée. Elles avaient longtemps cherché cette entrée.',explain:'Repère les chaînes d’accords et les temps composés.'},
{id:'d4b',level:'4e',title:'La ville endormie',topic:'Ponctuation',text:'Lorsque la nuit tomba, les rues devinrent silencieuses. Pourtant, derrière les fenêtres, quelques lumières brillaient encore.',explain:'Les virgules organisent les propositions.'},
{id:'d3a',level:'3e',title:'Le carnet retrouvé',topic:'Brevet',text:'Bien qu’ils aient parcouru des kilomètres, les voyageurs n’avaient pas oublié les promesses qu’ils s’étaient faites.',explain:'Observe les subordonnées et les accords des participes passés.'},
{id:'d3b',level:'3e',title:'L’aube',topic:'Brevet',text:'À l’aube, les maisons que nous avions aperçues semblaient désertes. Personne ne savait ce qui s’était produit pendant la nuit.',explain:'Attention aux participes passés et aux formes pronominales.'},
{"id": "d6c", "level": "6e", "title": "Le marché du samedi", "topic": "Homophones", "text": "Le samedi, Lucas va au marché avec son grand-père. Ils achètent des pommes et des tomates. Le marchand est gentil et il donne une poire à Lucas. Ses parents sont contents : le panier est plein.", "explain": "Distingue a / à, et / est, son / sont : remplace par avait, était, étaient pour vérifier."},
{"id": "d6d", "level": "6e", "title": "La tempête", "topic": "Imparfait", "text": "Le vent soufflait fort sur la côte. Les vagues frappaient les rochers et les bateaux restaient au port. Dans la maison, nous écoutions la pluie. Ma sœur lisait près de la cheminée.", "explain": "À l’imparfait : -ait avec il / elle, -ions avec nous, -aient avec ils / elles."},
{"id": "d6e", "level": "6e", "title": "Les chats de la voisine", "topic": "Accords", "text": "La voisine a trois chats noirs. Ils dorment sur le mur et surveillent les oiseaux. Le plus petit chat grimpe souvent dans les arbres. Les enfants du quartier l’appellent Filou.", "explain": "Repère le nom noyau pour accorder les adjectifs, puis le sujet pour accorder le verbe."},
{"id": "d6f", "level": "6e", "title": "Une journée à la plage", "topic": "Conjugaison", "text": "Ce matin, nous sommes allés à la plage. Mon frère a construit un château de sable. J’ai ramassé des coquillages blancs. Le soir, nous étions fatigués mais heureux.", "explain": "Passé composé : avec être, le participe s’accorde avec le sujet ; avec avoir, pas avec le sujet."},
{"id": "d5c", "level": "5e", "title": "Le château fort", "topic": "Lexique", "text": "Au Moyen Âge, les seigneurs vivaient dans des châteaux forts. Des murailles épaisses protégeaient les habitants. Les paysans cultivaient les champs autour du domaine et apportaient une partie de leurs récoltes au seigneur.", "explain": "Pluriel en -x des noms en -eau, imparfait en -aient, leur / leurs."},
{"id": "d5d", "level": "5e", "title": "La course", "topic": "Passé simple", "text": "Le signal retentit et les coureurs s’élancèrent. Julie prit rapidement la tête. Dans le dernier virage, elle accéléra encore. Ses camarades l’encouragèrent et elle franchit la ligne d’arrivée la première.", "explain": "Passé simple : -a / -èrent pour les verbes en -er ; il prit, il franchit."},
{"id": "d5e", "level": "5e", "title": "Le gâteau d’anniversaire", "topic": "Participes passés", "text": "Pour l’anniversaire de Nina, ses cousines sont venues tôt. Elles ont préparé un gâteau au chocolat et ont décoré la table. Quand Nina est entrée, tout le monde a chanté. Elle était très émue.", "explain": "Avec être, le participe passé s’accorde avec le sujet ; avec avoir, il ne s’accorde pas avec le sujet."},
{"id": "d5f", "level": "5e", "title": "Le refuge", "topic": "Homophones", "text": "Ces randonneurs ont marché toute la journée. Ils se sont arrêtés près d’un refuge où ils ont dormi. Le gardien leur a offert une soupe chaude. On entendait le vent qui soufflait sur la montagne.", "explain": "Distingue ces / ses, ont / on, ou / où, leur / leurs."},
{"id": "d4c", "level": "4e", "title": "L’expédition", "topic": "Accords complexes", "text": "Les cartes que les explorateurs avaient dessinées étaient précieuses. Ils les avaient protégées de la pluie pendant tout le voyage. Lorsqu’ils atteignirent enfin le fleuve, ils comprirent que leurs efforts n’avaient pas été vains.", "explain": "Participe passé avec avoir : il s’accorde avec le COD seulement s’il est placé avant (que, les)."},
{"id": "d4d", "level": "4e", "title": "Le concert", "topic": "Temps du récit", "text": "La salle était pleine lorsque les musiciens entrèrent sur scène. Le silence se fit aussitôt. Le premier morceau commença doucement, puis le rythme s’accéléra. Les spectateurs, émerveillés, applaudirent pendant plusieurs minutes.", "explain": "Imparfait pour le décor, passé simple pour les actions ; accord de l’adjectif détaché « émerveillés »."},
{"id": "d4e", "level": "4e", "title": "Le message", "topic": "Homophones", "text": "Quand elle reçut le message, Claire s’inquiéta un peu. Ce n’était pas la première fois que son frère partait sans prévenir. Elle se demanda où il pouvait être. Quant à ses parents, ils restaient calmes.", "explain": "Distingue quand / quant, ce / se, ou / où, peu / peut."},
{"id": "d4f", "level": "4e", "title": "La forêt en automne", "topic": "Ponctuation", "text": "En automne, la forêt change de visage : les feuilles jaunes, rousses et orangées tombent lentement. Les promeneurs, chaudement vêtus, ramassent des châtaignes. Au loin, on entend le cri d’un geai. Quelle saison magnifique !", "explain": "Deux-points, virgules d’énumération et d’apposition, phrase exclamative ; accord des adjectifs de couleur."},
{"id":"orig3e2026_01","level":"3e","title":"3e · La lettre oubliée","topic":"Consolidation — Accords","text":"Chaque soir, les voisins se retrouvaient devant la petite maison. Ils échangeaient quelques nouvelles et observaient les lumières du village. Un matin, une enveloppe mystérieuse apparut sur le banc. Personne ne savait qui l'avait déposée. Les enfants, intrigués, décidèrent de prévenir leurs parents avant de l'ouvrir.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords."},
{"id":"orig3e2026_02","level":"3e","title":"3e · Au bord du lac","topic":"Consolidation — Homophones","text":"À l'aube, Léa a rejoint ses amis près du lac. Ils sont venus avec leurs vélos et ont posé leurs sacs sur l'herbe. Le soleil se levait lentement, et ses reflets éclairaient l'eau calme. Chacun voulait profiter de cette journée, mais personne n'avait oublié les consignes de sécurité.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : homophones."},
{"id":"orig3e2026_03","level":"3e","title":"3e · La cour silencieuse","topic":"Consolidation — Imparfait","text":"Les élèves attendaient devant le portail tandis que les arbres perdaient leurs dernières feuilles. Une pluie fine tombait sur les bancs vides. Le gardien ouvrait toujours les portes à la même heure. Ce matin-là, pourtant, rien ne semblait habituel : les couloirs demeuraient silencieux et les fenêtres étaient encore fermées.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : imparfait."},
{"id":"orig3e2026_04","level":"3e","title":"3e · Le vieux vélo","topic":"Consolidation — Participes passés","text":"Mon frère avait retrouvé un vélo abandonné derrière la grange. Il l'a nettoyé avec soin, puis il a réparé les freins. Nos parents sont venus admirer son travail. Les roues, couvertes de poussière, brillaient enfin. Le lendemain, nous sommes partis ensemble sur le chemin qui longeait les champs.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : participes passés."},
{"id":"orig3e2026_05","level":"3e","title":"3e · Le marché du samedi","topic":"Consolidation — Lexique","text":"Sous les auvents colorés, les marchands disposaient des paniers remplis de fruits. Une odeur de pain chaud flottait dans les allées. Les clients choisissaient leurs provisions et échangeaient des sourires. Malgré le bruit de la foule, une vieille musicienne jouait doucement près de la fontaine, attirant les passants curieux.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : lexique."},
{"id":"orig3e2026_06","level":"3e","title":"3e · La gare déserte","topic":"Intermédiaire — Temps du récit","text":"Lorsque le dernier train quitta la gare, un silence étrange s'installa. Nous avions attendu longtemps sur le quai, sans comprendre pourquoi personne ne venait. Les horloges indiquaient minuit. Soudain, une porte s'ouvrit au fond du bâtiment, et une silhouette apparut sous la lumière vacillante d'une lampe.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : temps du récit."},
{"id":"orig3e2026_07","level":"3e","title":"3e · Les photos retrouvées","topic":"Intermédiaire — Accords","text":"Les photographies que ma grand-mère avait conservées racontaient une histoire oubliée. Certaines montraient des rues disparues, d'autres représentaient des visages inconnus. Nous les avons regardées attentivement. Les légendes, écrites à l'encre bleue, nous ont permis de reconnaître plusieurs membres de notre famille.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords."},
{"id":"orig3e2026_08","level":"3e","title":"3e · Un orage en montagne","topic":"Intermédiaire — Conjugaison","text":"Nous marchions depuis deux heures lorsque les nuages recouvrirent les sommets. Le vent s'était levé brusquement et les premières gouttes frappaient les rochers. Notre guide nous demanda de rester groupés. Bien que le sentier fût encore visible, nous décidâmes de redescendre avant que l'orage ne gagne la vallée.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : conjugaison."},
{"id":"orig3e2026_09","level":"3e","title":"3e · La représentation","topic":"Intermédiaire — Homophones","text":"Ce soir-là, les comédiens se préparaient derrière le rideau. Chacun connaissait son rôle, mais certains craignaient d'oublier leurs répliques. Le public était déjà installé, et l'on entendait des murmures dans la salle. Quand les lumières se sont éteintes, tous ont retenu leur souffle avant la première scène.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : homophones."},
{"id":"orig3e2026_10","level":"3e","title":"3e · Le carnet de voyage","topic":"Intermédiaire — Ponctuation","text":"Dans mon carnet, j'avais noté les noms des villes traversées, les rencontres inattendues et les paysages admirés. Pourtant, aucun mot ne suffisait à décrire cette vallée. Les maisons semblaient suspendues au-dessus du fleuve. Je compris alors que certains souvenirs, même soigneusement racontés, gardent une part de mystère.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : ponctuation."},
{"id":"orig3e2026_11","level":"3e","title":"3e · La maison aux volets bleus","topic":"Brevet — Accords complexes","text":"Lorsque nous sommes revenus au village, la maison que nous avions connue paraissait abandonnée. Les volets bleus, autrefois soigneusement repeints, étaient maintenant couverts de poussière. Des herbes avaient poussé entre les pierres. Ma sœur s'est arrêtée devant le portail, émue par les souvenirs qui lui revenaient soudain.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords complexes."},
{"id":"orig3e2026_12","level":"3e","title":"3e · La nuit des étoiles","topic":"Brevet — Subordination","text":"Bien que le ciel se fût assombri, les jeunes astronomes avaient installé leurs instruments sur la colline. Ils espéraient apercevoir une pluie d'étoiles filantes dont leur professeur leur avait parlé. Lorsque les nuages se dissipèrent enfin, une lumière traversa l'horizon. Tous demeurèrent silencieux, fascinés par ce spectacle inattendu.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : subordination."},
{"id":"orig3e2026_13","level":"3e","title":"3e · La décision","topic":"Brevet — Temps verbaux","text":"Depuis plusieurs semaines, Inès hésitait à participer au concours. Ses amis l'avaient encouragée, mais elle doutait encore de ses capacités. Le matin de l'inscription, elle relut les textes qu'elle avait écrits. Puis, sans prévenir personne, elle franchit la porte du bureau et déposa son dossier.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : temps verbaux."},
{"id":"orig3e2026_14","level":"3e","title":"3e · Les arbres du souvenir","topic":"Brevet — Participes passés","text":"Les arbres que les habitants avaient plantés après la tempête étaient devenus immenses. Leurs branches s'étendaient au-dessus des chemins reconstruits. Chaque année, les familles se réunissaient pour raconter ce qu'elles avaient vécu. Les enfants écoutaient ces récits avec attention, conscients que le paysage gardait la mémoire des événements.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : participes passés."},
{"id":"orig3e2026_15","level":"3e","title":"3e · L'inconnu du quai","topic":"Brevet — Orthographe lexicale","text":"Un homme vêtu d'un manteau sombre attendait près de la voie ferrée. Il tenait une valise ancienne dont la poignée semblait fragile. Les voyageurs, pressés de rentrer, passaient devant lui sans le remarquer. Pourtant, son regard inquiet et son immobilité donnaient à cette scène ordinaire une atmosphère singulièrement mystérieuse.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : orthographe lexicale."},
{"id":"orig3e2026_16","level":"3e","title":"3e · Les promesses du printemps","topic":"Expert — Subordination","text":"Quelles que fussent les difficultés rencontrées pendant l'hiver, les habitants n'avaient jamais renoncé à reconstruire leur jardin collectif. Les graines qu'ils avaient soigneusement protégées commençaient à germer. Chacun apportait les outils dont il disposait, tandis que les plus jeunes préparaient les parcelles où pousseraient bientôt les premières fleurs.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : subordination."},
{"id":"orig3e2026_17","level":"3e","title":"3e · L'atelier fermé","topic":"Expert — Accords complexes","text":"Les lettres qu'elle avait écrites étaient restées dans le tiroir où elle les avait rangées. Elle s'était promis de les envoyer, mais les semaines s'étaient succédé sans qu'elle trouvât le courage de le faire. Lorsqu'elle les relut enfin, certaines phrases lui parurent étrangères, comme si quelqu'un d'autre les avait composées.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords complexes."},
{"id":"orig3e2026_18","level":"3e","title":"3e · Le passage secret","topic":"Expert — Temps du récit","text":"À peine avions-nous franchi l'étroite ouverture que la porte se referma derrière nous. Les marches, usées par des siècles de passages, descendaient vers une salle obscure. Nous ignorions où conduisait cet escalier, mais les inscriptions gravées dans la pierre semblaient indiquer qu'il avait autrefois servi de refuge.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : temps du récit."},
{"id":"orig3e2026_19","level":"3e","title":"3e · La dernière répétition","topic":"Expert — Homophones et accords","text":"Quoiqu'ils se fussent entraînés durant des mois, les musiciens redoutaient encore la représentation. Chacun vérifiait les partitions qu'on lui avait confiées. Les instruments, accordés avec précision, attendaient sur la scène. Dès que la cheffe d'orchestre leva les mains, les conversations cessèrent et une harmonie inattendue emplit la salle.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : homophones et accords."},
{"id":"orig3e2026_20","level":"3e","title":"3e · L'horizon retrouvé","topic":"Expert — Syntaxe","text":"Ceux qui avaient quitté la région depuis longtemps reconnaissaient à peine les chemins qu'ils parcouraient autrefois. Là où s'étendaient des terrains abandonnés, des jardins avaient été aménagés. Les habitants s'étaient organisés pour préserver ces espaces, convaincus que les générations futures sauraient apprécier les efforts accomplis.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : syntaxe."}];

function tokParts(tok){const m=String(tok).match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}](?:[\p{L}\p{N}'’-]*[\p{L}\p{N}])?)([^\p{L}\p{N}]*)$/u);return m?{pre:m[1],core:m[2],post:m[3]}:null}

 }

function punctuatedSpeech(t){return t.replace(/«/g,' ouvrez les guillemets ').replace(/»/g,' fermez les guillemets ').replace(/…/g,' points de suspension ').replace(/;/g,' point-virgule ').replace(/:/g,' deux-points ').replace(/,/g,' virgule ').replace(/\?/g,' point d’interrogation ').replace(/!/g,' point d’exclamation ').replace(/\./g,' point ').replace(/\s+/g,' ').trim()}
function dictSettings(){return {style:document.getElementById('readingStyle')?.value||'guided',rate:Number(document.getElementById('rate')?.value||.85),pause:Number(document.getElementById('pauseLength')?.value||2),punct:document.getElementById('sayPunctuation')?.checked!==false}}
function speechSequence(text,opts){if(opts.style!=='guided')return speechParts(text).map(x=>({text:x,wait:opts.style==='review'?300:650}));let q=[];dictationSentences(text).forEach(x=>{if(x.newParagraph)q.push({text:'À la ligne.',wait:1100});let t=x.text.trim(),end=t.match(/([.!?…]+)$/),mark=end?end[1]:'';if(mark)t=t.slice(0,-mark.length).trim();let names={'.':'Point.','!':'Point d’exclamation.','?':'Point d’interrogation.','…':'Points de suspension.'};let parts=t.split(/([,;:«»])/);let spoken=[];for(let part of parts){if(part===',')spoken.push({text:'Virgule.',wait:380});else if(part===';')spoken.push({text:'Point-virgule.',wait:480});else if(part===':')spoken.push({text:'Deux-points.',wait:480});else if(part==='«')spoken.push({text:'Ouvrez les guillemets.',wait:300});else if(part==='»')spoken.push({text:'Fermez les guillemets.',wait:300});else if(part.trim())spoken.push({text:part.trim(),wait:250})}if(opts.punct){spoken.forEach((p,i)=>{if(i===spoken.length-1)p.wait=650;q.push(p)});if(mark)q.push({text:names[mark[0]]||'Point.',wait:Math.round(opts.pause*1000)})}else{q.push({text:x.text,wait:Math.round(opts.pause*1000)})}});return q}
function speak(text,opts=dictSettings()){if(!String(text||'').trim())return toast('Aucun texte à lire.');if(!('speechSynthesis'in window))return audioStatus('Synthèse vocale indisponible.',true);stopAudio();const synth=window.speechSynthesis,token=ttsToken;ttsQueue=speechSequence(text,opts);ttsIndex=0;let voiceRate=opts.style==='review'?.9:opts.rate;function next(){if(token!==ttsToken)return;if(ttsIndex>=ttsQueue.length){audioStatus('Lecture terminée.');return}const step=ttsQueue[ttsIndex++],u=new SpeechSynthesisUtterance(step.text);currentUtterance=u;u.lang='fr-FR';u.rate=voiceRate;u.volume=1;const voices=synth.getVoices();const fr=voices.find(v=>v.lang.toLowerCase()==='fr-fr')||voices.find(v=>v.lang.toLowerCase().startsWith('fr'));if(fr)u.voice=fr;u.onstart=()=>audioStatus('Lecture '+ttsIndex+' / '+ttsQueue.length+'…'+(voices.length&&!fr?' ⚠️ Aucune voix française sur cet appareil : la prononciation peut être fausse. Installe une voix française (réglages › synthèse vocale) ou utilise Chrome / Edge.':''),!!(voices.length&&!fr));u.onend=()=>{if(token===ttsToken)ttsWatchdog=setTimeout(next,step.wait)};u.onerror=e=>{if(token===ttsToken&&!['canceled','interrupted'].includes(e.error))audioStatus('Erreur de lecture vocale : '+e.error,true)};try{synth.speak(u)}catch(e){audioStatus('Impossible de lire la dictée.',true)}}audioStatus('Préparation de la lecture…');try{synth.cancel();next();listenCount++}catch(e){audioStatus('Lecture indisponible.',true)}}
function playSound(style){if(active?.audio){stopAudio();let a=new Audio(active.audio);currentAudio=a;a.onended=()=>audioStatus('Lecture terminée.');a.play().then(()=>audioStatus('Enregistrement en cours…')).catch(()=>audioStatus('Enregistrement indisponible.',true));return}let opts=dictSettings();if(style)opts.style=style;speak(active?.text||'',opts)}

function exercise(){if(!active&&['classic','gap','hunt','flash','mystery'].includes(mode))return selectDict(false);if(!active&&mode==='test')return selectDict(true);if(!active)return '<div class="card">Choisis une dictée.</div>';const d=active;let common=`<div class="btnrow">${button('◀ Changer de dictée',"active=null;render()",'alt')}<span class="badge">${esc(d.level)} · ${esc(d.topic)}</span></div><h2>${esc(d.title)}</h2>`;let audio=`<div class="card"><h3>🔊 Studio de dictée</h3><p id="audioStatus" class="audio-status" role="status" aria-live="polite">Choisis ton mode de lecture.</p><label class="label">Lecture</label><select id="readingStyle" class="field"><option value="guided">Dictée guidée : ponctuation et pauses</option><option value="full">Lecture intégrale</option><option value="review">Relecture finale</option></select><div class="btnrow">${button("▶ Écouter","playSound()")}${button("⏹ Arrêter","stopAudio()","alt")}${button("↻ Recommencer","playSound()","alt")}</div><div class="twocol"><div><label class="label">Vitesse</label><select id="rate" class="field"><option value=".85">Normale</option><option value=".65" selected>Lente</option><option value=".5">Très lente</option><option value=".4">Très lente +</option></select></div><div><label class="label">Pause entre les phrases</label><select id="pauseLength" class="field"><option value="2">2 secondes</option><option value="3" selected>3 secondes</option><option value="5">5 secondes</option><option value="8">8 secondes</option></select></div></div><label class="dictation-toggle"><input id="sayPunctuation" type="checkbox" checked> Annoncer la ponctuation</label><label class="label">Réécouter une phrase</label><div class="btnrow"><select id="sentenceNum" class="field" style="max-width:160px">${dictationSentences(d.text).map((_,i)=>`<option value="${i}">Phrase ${i+1}</option>`).join("")}</select>${button("▶ Phrase","sentence()","alt")}</div></div>`;if(mode==='classic'||mode==='test')return common+audio+`<div class="card"><h3>✍️ À toi d’écrire</h3><p class="muted">Écris le texte entendu. Les majuscules et la ponctuation sont également travaillées.</p><textarea id="response" class="field" placeholder="Écris ta dictée ici…" spellcheck="false" autocomplete="off"></textarea><div class="btnrow">${button('Corriger ma dictée','checkText()','pink')}</div></div>`;if(mode==='gap'){const g=exData(d);return common+audio+`<div class="card"><h3>🧩 Complète les ${g.answers.length} mots</h3><p class="muted">Écoute la dictée : les trous visent les accords, les terminaisons verbales et les homophones.</p><p style="line-height:3">${g.tokens.map((t,i)=>{const k=g.slots.indexOf(i);if(k<0)return esc(t)+' ';const p=tokParts(t);return esc(p.pre)+`<input class="field gapinput" aria-label="Mot manquant ${k+1}" style="width:${Math.max(76,p.core.length*13+26)}px;display:inline-block;padding:7px" data-i="${k}" spellcheck="false" autocomplete="off" autocapitalize="off">`+esc(p.post)+' '}).join('')}</p>${button('Vérifier','checkGaps()','pink')}</div>`}
if(mode==='hunt'){const h=exData(d);return common+`<div class="card"><h3>🔎 Trouve les ${h.errors.length} fautes cachées</h3><p class="muted">Le texte contient ${h.errors.length} erreurs du type de celles qu’on fait vraiment : homophones, accords, terminaisons. Touche les mots fautifs, puis vérifie.</p><div id="huntwords" style="line-height:2.8">${h.shown.map((w,i)=>`<button class="word" data-i="${i}" onclick="this.classList.toggle('found')">${esc(w)}</button>`).join(' ')}</div>${button('Vérifier','checkHunt()','pink')}</div>`}
if(mode==='flash'){const f=exData(d);setTimeout(startFlashTimer,30);return common+`<div class="card"><h3>⚡ Observe, mémorise, écris</h3><p class="muted">Tu as <b id="flashCount">${f.seconds}</b> s pour mémoriser la phrase. Elle se masquera ensuite.</p><div id="flashphrase" class="feedback">${esc(f.sentence)}</div><div class="btnrow">${button('Je suis prêt·e : masquer','hideFlash()','alt')}</div><textarea id="response" class="field" spellcheck="false" autocomplete="off" disabled placeholder="La zone s’ouvrira quand la phrase sera masquée…"></textarea>${button('Vérifier','checkFlash()','pink')}</div>`}
if(mode==='mystery'){const m=exData(d);window.mysterySelected=[];return common+`<div class="card"><h3>🔮 Reconstruis la phrase</h3><p class="muted">Écoute la phrase, puis touche les mots dans le bon ordre.</p><div class="btnrow">${button('▶ Écouter la phrase','speak(exCache.sentence)')}${button('⏹ Arrêter','stopAudio()','alt')}</div><p id="audioStatus" class="audio-status" role="status" aria-live="polite"></p><div id="assembled" class="feedback" style="min-height:55px"></div><div id="tiles">${m.order.map(i=>`<button class="word" data-i="${i}" onclick="pickWord(${i},this)">${esc(m.words[i])}</button>`).join('')}</div><div class="btnrow">${button('↶ Annuler','undoMystery()','alt')}${button('Effacer','resetMystery()','alt')}${button('Vérifier','checkMystery()','pink')}</div></div>`}
return common}
function normalize(s){return String(s).toLocaleLowerCase('fr').normalize('NFC').replace(/[’]/g,"'").replace(/[^\p{L}\p{N}'\s-]/gu,' ').replace(/\s+/g,' ').trim()}function editDistance(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}function diff(expected,actual){let a=normalize(expected).split(' ').filter(Boolean),b=normalize(actual).split(' ').filter(Boolean),n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=n,j=m,errors=[];while(i||j){if(i&&j&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){if(a[i-1]!==b[j-1])errors.push({want:a[i-1],got:b[j-1],kind:'Mot différent'});i--;j--}else if(i&&dp[i][j]===dp[i-1][j]+1){errors.push({want:a[i-1],got:'—',kind:'Mot manquant'});i--}else{errors.push({want:'—',got:b[j-1],kind:'Mot ajouté'});j--}}return {errors:errors.reverse(),score:Math.round(100*(1-dp[n][m]/Math.max(1,n,m))),words:n}}function record(id,kind,score){state.history.push({id,kind,score,date:new Date().toISOString(),level:state.level});state.xp+=Math.max(5,Math.round(score/10));save()}function showResult(title,score,html,id=active?.id||mode){record(id,mode,score);window.lastResult={title,score,html,mode,id};page='result';render()}function diagnoseError(e){const w=e.want,g=e.got;const pairs=[['a','à'],['et','est'],['son','sont'],['on','ont'],['ou','où'],['ce','se'],['ces','ses'],['leur','leurs'],['la','là']];if(e.kind==='Mot manquant')return {cat:'Mot oublié',tip:'Réécoute la phrase en suivant son sens, puis vérifie chaque mot.'};if(e.kind==='Mot ajouté')return {cat:'Mot supplémentaire',tip:'Compare ta phrase avec celle entendue et vérifie si ce mot est nécessaire.'};if(pairs.some(p=>p.includes(w)&&p.includes(g)))return {cat:'Homophones',tip:'Deux mots peuvent se prononcer de la même façon sans avoir le même rôle. Essaie de remplacer le mot par une autre forme : « a » par « avait », « est » par « était », « sont » par « étaient ».'};if(w.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===g.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {cat:'Accent',tip:'Observe la voyelle et son accent. Relis le mot correctement écrit et mémorise sa graphie.'};if(w.replace(/s$/,'')===g.replace(/s$/,'')||w.replace(/x$/,'')===g.replace(/x$/,''))return {cat:'Accord ou pluriel possible',tip:'Cherche le déterminant, le nom et le sujet : le nombre peut modifier la terminaison. Vérifie aussi si le -s fait partie du mot.'};if(/(aient|ait|ais|ons|ez|ent|é|ée|és|ées|er)$/.test(w)&&/(aient|ait|ais|ons|ez|ent|é|ée|és|ées|er)$/.test(g))return {cat:'Forme verbale ou accord possible',tip:'Identifie le sujet, le temps et la fonction du mot. Si c’est un participe passé, repère son auxiliaire.'};return {cat:'Orthographe à vérifier',tip:'Observe les lettres différentes, les éventuelles consonnes doubles et la famille du mot. La catégorie grammaticale doit être confirmée avec le contexte.'}}
function checkText(){let val=$('#response').value.trim();if(!val)return toast('Écris d’abord ta dictée.');let d=diff(active.text,val),errs=d.errors.map((e,i)=>({...e,...diagnoseError(e),n:i}));window.remediation={id:active.id,title:active.title,errors:errs,done:{}};state.weakWords=state.weakWords||[];for(const e of errs){if(e.want!=='—'&&!state.weakWords.some(x=>x.word===e.want&&x.source===active.id))state.weakWords.push({word:e.want,source:active.id,category:e.cat,date:new Date().toISOString()})}state.weakWords=state.weakWords.slice(-120);save();let html=`<h3>Ta correction détaillée</h3><p><b>Texte attendu :</b> ${esc(active.text)}</p><p><b>Ta réponse :</b> ${esc(val)}</p><p><b>${errs.length} écart(s)</b> repéré(s) sur ${d.words} mots.</p>`+(!errs.length?'<div class="feedback ok">Bravo ! Aucun écart détecté dans les mots.</div>':'')+errs.slice(0,35).map(e=>`<div class="feedback warn"><b>${esc(e.cat)}</b> · « ${esc(e.got)} » → <b>« ${esc(e.want)} »</b><p>${esc(e.tip)}</p></div>`).join('')+`<p>${esc(active.explain||'Relis les accords, les homophones et la conjugaison.')}</p>${formHtml(active.text,val)}<p class="muted">Analyse indicative : certaines catégories sont des hypothèses, à vérifier avec la phrase. Le score porte sur les mots ; majuscules et ponctuation sont évaluées à part, ci-dessus.</p>`;if(errs.some(e=>e.want!=='—'))html+=`<div class="card" style="background:#f4efff"><h3>🎯 Ton entraînement personnalisé</h3><p>Retrouve l’orthographe correcte des mots que tu viens de manquer, puis refais la dictée pour consolider tes acquis.</p>${button('Commencer mes exercices','startRemediation()','pink')}</div>`;showResult('Correction de la dictée',d.score,html)}

const miniLessons={
'Homophones':{title:'Choisir le bon homophone',rule:'Deux mots peuvent se prononcer pareil, mais leur nature et leur sens diffèrent. « a » est le verbe avoir (avait) ; « à » est une préposition. « est » est le verbe être (était) ; « et » relie des mots.',example:'Elle a un livre à lire. Il est calme et attentif.',tip:'Remplace mentalement a par avait, est par était.',tasks:[{type:'choice',q:'Elle ___ terminé son travail.',options:['a','à'],answer:'a',why:'On peut dire : elle avait terminé.'},{type:'choice',q:'Il ___ heureux ___ ses amis arrivent.',options:['est / et','et / est','est / est'],answer:'est / et',why:'Est = était ; et relie deux propositions.'},{type:'input',q:'Complète : Nous allons ___ la bibliothèque.',answer:'à',why:'« à » introduit le lieu ; « avait » ne convient pas.'}]},
'Accent':{title:'Observer les accents',rule:'Les accents changent parfois la prononciation ou distinguent des mots. On écrit « où » pour un lieu et « ou » pour un choix. « à » est une préposition, « a » une forme du verbe avoir.',example:'Où vas-tu ? À la gare ou au musée ?',tip:'Repère le sens de la phrase avant de choisir.',tasks:[{type:'choice',q:'___ se trouve ton cahier ?',options:['Ou','Où'],answer:'Où',why:'Il s’agit d’une question sur un lieu.'},{type:'input',q:'Complète : Thé ___ chocolat ?',answer:'ou',why:'Il s’agit d’un choix.'},{type:'choice',q:'Elle ___ déjà commencé.',options:['à','a'],answer:'a',why:'On peut dire « avait commencé ».'}]},
'Accord ou pluriel possible':{title:'Accorder dans le groupe nominal',rule:'Le déterminant, le nom et l’adjectif s’accordent généralement en genre et en nombre : « les grandes maisons ». Attention, tous les mots terminés par s ne sont pas des pluriels.',example:'Ces longues journées paraissaient interminables.',tip:'Repère le nom noyau, puis vérifie ses déterminants et adjectifs.',tasks:[{type:'choice',q:'Les fleurs sont ___ .',options:['rouge','rouges','rougées'],answer:'rouges',why:'Fleurs est féminin pluriel : rouges.'},{type:'input',q:'Complète : des maisons ___ (ancien).',answer:'anciennes',why:'Maisons est féminin pluriel.'},{type:'choice',q:'Choisis le groupe correctement accordé.',options:['ces grand arbres','ces grands arbres','ce grands arbres'],answer:'ces grands arbres',why:'Arbres est masculin pluriel.'}]},
'Forme verbale ou accord possible':{title:'Identifier la forme du verbe',rule:'Le verbe conjugué s’accorde avec son sujet. Le participe passé avec être s’accorde généralement avec le sujet. Avec avoir, il s’accorde avec le complément d’objet direct seulement si celui-ci est placé avant le verbe.',example:'Elles sont parties. Les lettres qu’il a écrites.',tip:'Trouve le sujet, le temps et l’auxiliaire ; pour avoir, cherche un COD placé avant.',tasks:[{type:'choice',q:'Les élèves ___ leur leçon.',options:['révise','révisent','révises'],answer:'révisent',why:'Les élèves est un sujet pluriel.'},{type:'input',q:'Complète : Elles sont ___ (partir).',answer:'parties',why:'Avec être, le participe s’accorde avec elles.'},{type:'choice',q:'Les lettres que nous avons ___ .',options:['écrit','écrits','écrites'],answer:'écrites',why:'Le COD les lettres est placé avant avoir.'}]},
'Orthographe à vérifier':{title:'Mémoriser les mots difficiles',rule:'Pour mémoriser un mot, observe ses lettres, découpe-le en syllabes, repère sa famille et réutilise-le dans une phrase. La répétition espacée aide à le retenir.',example:'Mystère → mystérieux ; courage → courageux.',tip:'Observe, cache, écris, vérifie, puis recommence plus tard.',tasks:[{type:'choice',q:'Quelle orthographe est correcte ?',options:['mystérieux','mistérieux','mystèrieux'],answer:'mystérieux',why:'Le mot appartient à la famille de mystère.'},{type:'input',q:'Écris correctement : courrage',answer:'courage',why:'Courage s’écrit avec un seul r.'},{type:'choice',q:'Quelle méthode aide à mémoriser un mot ?',options:['Le recopier sans le regarder ensuite','Observer, cacher, écrire et vérifier','Deviner au hasard'],answer:'Observer, cacher, écrire et vérifier',why:'L’évocation et la vérification consolident la mémoire.'}]},
'Mot oublié':{title:'Écouter et segmenter',rule:'Pour éviter les oublis, écoute la phrase entière, repère ses groupes de sens, puis relis chaque groupe en vérifiant les petits mots.',example:'Au petit matin / les voyageurs / ont quitté la ville.',tip:'Écoute, reformule, puis vérifie chaque groupe de mots.',tasks:[{type:'choice',q:'Quelle stratégie limite les mots oubliés ?',options:['Écrire au hasard','Découper la phrase en groupes de sens','Ne pas relire'],answer:'Découper la phrase en groupes de sens',why:'Les groupes de sens facilitent la mémorisation.'},{type:'input',q:'Complète : Elle ___ partie tôt.',answer:'est',why:'Le verbe est indispensable au passé composé.'},{type:'choice',q:'Dans « Il a pris son sac », quel mot est un déterminant ?',options:['pris','son','a'],answer:'son',why:'Son accompagne le nom sac.'}]},
'Mot supplémentaire':{title:'Relire avec précision',rule:'Une dictée fidèle ne doit contenir ni mots ajoutés ni mots omis. Compare ce que tu as écrit à la phrase entendue, groupe de sens par groupe de sens.',example:'Phrase dictée : « Il rentre chez lui. » Ne pas ajouter « vite ».',tip:'À la relecture, vérifie les mots que tu as peut-être ajoutés.',tasks:[{type:'choice',q:'Phrase dictée : « Elle ouvre la porte. » Quelle copie est fidèle ?',options:['Elle ouvre vite la porte.','Elle ouvre la porte.','Elle ouvre la grande porte.'],answer:'Elle ouvre la porte.',why:'Aucun mot supplémentaire.'},{type:'input',q:'Phrase dictée : « Le vent souffle. » Quel mot faut-il retirer de « Le vent froid souffle » ?',answer:'froid',why:'Le mot froid ne figure pas dans la phrase.'},{type:'choice',q:'Que faire en cas de doute ?',options:['Ajouter un adjectif','Réécouter la phrase','Inventer un mot'],answer:'Réécouter la phrase',why:'La fidélité au texte est essentielle.'}]}
};

function startRemediation(){const r=window.remediation;if(!r||!r.errors.length)return toast('Aucune erreur à retravailler.');r.queue=r.errors.filter(e=>e.want!=='—').slice(0,12);r.categories=[...new Set(r.errors.map(e=>lessonKey(e.cat)))].slice(0,4);r.stage=0;r.index=0;r.task=0;r.done={};r.taskDone={};r.category=r.categories[0]||'Orthographe à vérifier';page='remediation';render()}

if(r.stage===2){const e=r.queue[r.index];if(!e){r.stage=3;render();return ''}return '<section class="hero"><h1>🎯 Mes mots à consolider</h1><p>Mot '+(r.index+1)+' / '+r.queue.length+'</p></section><div class="card"><h3>Corrige ton erreur</h3><p>Tu avais écrit : <b>'+esc(e.got)+'</b></p><p>'+esc(e.tip)+'</p><label class="label" for="repairWord">Écris le mot correct</label><input id="repairWord" class="field" spellcheck="false" autocomplete="off"><div id="repairFeedback" aria-live="polite"></div><div class="btnrow"><button class="btn pink" onclick="checkRepair()">Vérifier</button><button id="repairNext" class="btn alt hidden" onclick="nextRepair()">Suivant →</button></div></div>'}

function checkLessonTask(){const r=window.remediation,t=miniLessons[r.category].tasks[r.task],v=t.type==='choice'?document.querySelector('input[name="lessonAnswer"]:checked')?.value:$('#lessonAnswer')?.value;if(v===undefined||!String(v).trim())return toast('Choisis ou écris une réponse.');const answer=t.type==='choice'?t.options[Number(v)]:v,good=normalize(answer)===normalize(t.answer);r.taskDone[r.category+'_'+r.task]=good;$('#lessonFeedback').innerHTML='<div class="feedback '+(good?'ok':'warn')+'"><b>'+(good?'Bonne réponse !':'À retenir : '+esc(t.answer))+'</b><p>'+esc(t.why)+'</p></div>';$('#lessonCheck').disabled=true;$('#lessonNext').classList.remove('hidden');document.querySelectorAll('input[name="lessonAnswer"],#lessonAnswer').forEach(x=>x.disabled=true);state.lessonHistory=state.lessonHistory||[];state.lessonHistory.push({category:r.category,good,date:new Date().toISOString()});state.lessonHistory=state.lessonHistory.slice(-250);save()}

function checkRepair(){const r=window.remediation,e=r?.queue?.[r.index],input=$('#repairWord');if(!e||!input)return;if(!input.value.trim())return toast('Écris ta correction.');if(input.disabled)return;const good=normalize(input.value)===normalize(e.want);r.done[r.index]=good;$('#repairFeedback').innerHTML='<div class="feedback '+(good?'ok':'warn')+'">'+(good?'✓ Bien joué !':'À retenir :')+' <b>'+esc(e.want)+'</b>. '+esc(e.tip)+'</div>';$('#repairNext').classList.remove('hidden');input.disabled=true;state.repairHistory=state.repairHistory||[];state.repairHistory.push({word:e.want,good,date:new Date().toISOString()});state.repairHistory=state.repairHistory.slice(-200);save()}

function checkGaps(){const ins=[...document.querySelectorAll('.gapinput')],ans=exCache?.answers||[];if(ins.some(x=>!x.value.trim()))return toast('Complète tous les mots.');let ok=0;const h=ins.map((x,i)=>{const want=ans[i],good=normalize(x.value)===normalize(want);ok+=good;if(good)return `<div class="feedback ok">✓ <b>${esc(want)}</b></div>`;const dg=diagnoseError({want:normalize(want),got:normalize(x.value),kind:'Mot différent'});return `<div class="feedback warn">✕ « ${esc(x.value)} » → <b>« ${esc(want)} »</b> · ${esc(dg.cat)}<p>${esc(dg.tip)}</p></div>`}).join('');showResult('Dictée à trous',Math.round(ok/Math.max(1,ins.length)*100),h+`<p class="muted">Rejoue : les trous changent à chaque partie.</p>`)}
function checkHunt(){const h=exCache;if(!h)return;const picks=[...document.querySelectorAll('.word.found')].map(x=>+x.dataset.i),correct=h.errors.map(e=>e.i);const tp=picks.filter(x=>correct.includes(x)).length,wrong=picks.filter(x=>!correct.includes(x)).length;const list=h.errors.map(e=>`<div class="feedback ${picks.includes(e.i)?'ok':'warn'}">${picks.includes(e.i)?'✓ Trouvée':'✕ Manquée'} · « ${esc(e.got)} » → <b>« ${esc(e.want)} »</b> · ${esc(e.kind)}<p>${esc(e.why)}</p></div>`).join('');const fp=picks.filter(x=>!correct.includes(x)).map(i=>h.shown[i]);showResult('Chasse aux fautes',Math.round(Math.max(0,tp-wrong)/Math.max(1,correct.length)*100),`<p>Tu as trouvé <b>${tp} faute(s) sur ${correct.length}</b>${wrong?`, avec ${wrong} mot(s) correct(s) signalé(s) à tort (${esc(fp.join(', '))})`:''}.</p>${list}<p class="muted">Chaque mot signalé à tort retire un point.</p>`)}
function checkFlash(){const r=$('#response');if(r&&r.disabled)return toast('Masque d’abord la phrase.');const val=r?r.value.trim():'';if(!val)return toast('Écris la phrase.');const expected=exCache?.sentence||'',d=diff(expected,val),errs=d.errors.map(e=>({...e,...diagnoseError(e)}));showResult('Dictée flash',d.score,`<p><b>Phrase :</b> ${esc(expected)}</p><p><b>Ta réponse :</b> ${esc(val)}</p>${errs.length?errs.map(e=>`<div class="feedback warn"><b>${esc(e.cat)}</b> · « ${esc(e.got)} » → <b>« ${esc(e.want)} »</b></div>`).join(''):'<div class="feedback ok">Bravo, aucun écart dans les mots !</div>'}${formHtml(expected,val)}`)}
function pickWord(i,el){window.mysterySelected.push(i);el.disabled=true;$('#assembled').textContent=window.mysterySelected.map(i=>exCache.words[i]).join(' ')}

function checkMystery(){const w=exCache.words,a=window.mysterySelected.map(i=>w[i]);if(a.length<w.length)return toast('Place tous les mots.');const good=a.filter((v,i)=>v===w[i]).length;showResult('Phrase mystère',Math.round(good/w.length*100),`<p><b>Phrase attendue :</b> ${esc(w.join(' '))}</p><p><b>Ta proposition :</b> ${esc(a.join(' '))}</p><p>${good} mot(s) sur ${w.length} à la bonne place.</p>`)}
let quizSet=[];
function quizTitle(m){return m==='boss'?'Le boss de l’orthographe':m==='accord'?'Accords en folie':'Duel des mots'}
function startQuiz(m){stopAudio();mode=m;qIndex=0;answers=[];chosen=null;quizSet=buildQuiz(m);page='exercise';active={id:'quiz-'+m,title:quizTitle(m)};renderQuiz()}

function renderQuiz(){const q=quizSet[qIndex],max=quizSet.length;if(!q){$('#app').innerHTML='<div class="card">Aucune question disponible pour ce niveau.</div>';return}const back=mode==='lesson'?"nav('learn')":"nav('play')";$('#app').innerHTML=`<div class="btnrow">${button('◀ Quitter',back,'alt')}<span class="badge">${esc(state.level)} · Défi ${qIndex+1} / ${max}</span></div><div class="card"><div class="progress"><div style="width:${qIndex/max*100}%"></div></div><h2>${esc(active.title)}</h2><h3>${esc(q.q)}</h3><div id="choices">${q.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})">${esc(o)}</button>`).join('')}</div><div id="qfeedback" aria-live="polite"></div><div class="btnrow" id="quizActions">${button('Valider','validateQuiz()','pink')}</div></div>`}
function choose(i){if(document.querySelector('.choice:disabled'))return;chosen=i;document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',i===j))}
function validateQuiz(){if(chosen===null)return toast('Choisis une réponse.');const q=quizSet[qIndex],ok=chosen===q.a;answers.push({ok,q});document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;el.classList.toggle('good',j===q.a);el.classList.toggle('bad',j===chosen&&!ok)});$('#qfeedback').innerHTML=`<div class="feedback ${ok?'ok':'warn'}"><b>${ok?'Bien joué !':'À revoir : '+esc(q.opts[q.a])}</b><p>${esc(q.why)}</p></div>`;$('#quizActions').innerHTML=button(answers.length>=quizSet.length?'Voir mon résultat':'Défi suivant','nextQuiz()');chosen=null}
function nextQuiz(){if(answers.length>=quizSet.length){const good=answers.filter(x=>x.ok).length,score=Math.round(good/answers.length*100);const recap=answers.filter(x=>!x.ok).map(x=>`<div class="feedback warn"><b>${esc(x.q.q)}</b><p>Réponse : <b>${esc(x.q.opts[x.q.a])}</b> — ${esc(x.q.why)}</p></div>`).join('');showResult(active.title,score,`<p>${good} bonne(s) réponse(s) sur ${answers.length}.</p>${recap||'<div class="feedback ok">Sans faute, bravo !</div>'}<p class="muted">Rejoue : les questions changent à chaque partie.</p>`,active.id)}else{qIndex++;renderQuiz()}}

function resultView(){let r=window.lastResult||{title:'Résultat',score:0,html:''};return `<section class="hero"><h1>Mission terminée ! ✨</h1><p>Chaque essai te fait progresser.</p></section><div class="card" style="margin-top:18px"><h2>${esc(r.title)}</h2><div class="score">${r.score}%</div><div class="progress"><div style="width:${r.score}%"></div></div><p class="muted">+${Math.max(5,Math.round(r.score/10))} XP · Continue ton aventure !</p><hr>${r.html}<div class="btnrow">${r.mode?button('↻ Rejouer','replay()','pink'):''}${button('Autre défi',"nav('play')")}${button('Mes progrès',"nav('progress')",'alt')}</div></div>`}

const adventureRanks=['Apprenti des mots','Détective des accords','Explorateur des phrases','Maître des dictées','Champion des mots'];
function adventureData(){const h=state.history||[],xp=state.xp||0,rank=Math.min(4,Math.floor(xp/100)),progress=xp%100,unique=new Set(h.map(x=>x.id)).size;const badges=[{name:'Premier pas',icon:'✦',ok:h.length>=1,desc:'Terminer une activité'},{name:'Curieux des mots',icon:'◈',ok:h.length>=5,desc:'Terminer 5 activités'},{name:'Explorateur',icon:'◆',ok:unique>=5,desc:'Explorer 5 activités différentes'},{name:'Persévérant',icon:'↗',ok:h.length>=10,desc:'Terminer 10 activités'},{name:'Précision',icon:'★',ok:h.some(x=>x.score>=90),desc:'Obtenir au moins 90 %'},{name:'Champion',icon:'♛',ok:h.some(x=>x.score===100),desc:'Obtenir 100 %'}];return {h,xp,rank,progress,unique,badges}}
function nextAdventureMission(){const h=state.history||[];if(!h.length)return {title:'Ta première dictée',desc:'Commence ton aventure avec une dictée adaptée à ta classe.',action:"nav('test')",button:'Commencer'};const last=h[h.length-1];if(last.score<80)return {title:'Mission revanche',desc:'Reprends une dictée et essaie de dépasser ton dernier score de '+last.score+' %.',action:"nav('test')",button:'M’améliorer'};if(h.length<5)return {title:'Défi des 5 activités',desc:'Encore '+(5-h.length)+' activité(s) pour obtenir le badge Curieux des mots.',action:"nav('play')",button:'Relever le défi'};return {title:'Vers le prochain palier',desc:'Entraîne-toi sur une nouvelle dictée pour gagner de l’expérience.',action:"nav('test')",button:'Continuer'}}
function adventurePanel(compact=false){const a=adventureData(),m=nextAdventureMission(),next=Math.min(4,a.rank+1);return '<section class="adventure-dashboard"><div class="adventure-top"><div><span class="adventure-eyebrow">MON AVENTURE ORTHOGRAPHIQUE</span><h2>'+adventureRanks[a.rank]+'</h2><p>Niveau '+(a.rank+1)+' · '+a.xp+' XP</p></div><div class="adventure-medallion">'+(a.rank+1)+'</div></div><div class="adventure-track"><div style="width:'+a.progress+'%"></div></div><p class="adventure-small">'+(a.rank===4?'Tu as atteint le dernier rang !':(100-a.progress)+' XP avant : '+adventureRanks[next])+'</p><div class="adventure-mission"><div><span class="adventure-eyebrow">TA PROCHAINE MISSION</span><h3>'+m.title+'</h3><p>'+m.desc+'</p></div>'+button(m.button,m.action,'pink')+'</div>'+(compact?'<p class="adventure-small">'+a.badges.filter(x=>x.ok).length+' badges débloqués · '+a.unique+' activités explorées</p>':'<h3>Ta collection de badges</h3><div class="adventure-badges">'+a.badges.map(b=>'<div class="adventure-badge '+(b.ok?'unlocked':'locked')+'"><div class="adventure-symbol"><img src="images/'+({"Premier pas":"badge-premier-pas.webp","Curieux des mots":"badge-curieux-des-mots.webp","Explorateur":"badge-explorateur.webp","Persévérant":"badge-perseverant.webp","Précision":"badge-precision.webp","Champion":"badge-champion.webp"}[b.name]||'')+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span style="display:none">'+b.icon+'</span></div><b>'+b.name+'</b><small>'+b.desc+'</small></div>').join('')+'</div>')+'</section>'}
function progress(){const a=adventureData(),h=a.h,avg=h.length?Math.round(h.reduce((sum,x)=>sum+x.score,0)/h.length):0;const recent=h.slice(-5),first=h.slice(0,5),early=first.length?Math.round(first.reduce((sum,x)=>sum+x.score,0)/first.length):0,late=recent.length?Math.round(recent.reduce((sum,x)=>sum+x.score,0)/recent.length):0;return '<section class="hero"><h1>Mon aventure orthographique</h1><p>Chaque effort compte. Avance, collectionne tes badges et dépasse tes propres résultats.</p></section>'+adventurePanel()+'<div class="grid"><div class="card"><div class="stat">'+h.length+'</div><p>Activités terminées</p></div><div class="card"><div class="stat">'+avg+' %</div><p>Réussite moyenne</p></div><div class="card"><div class="stat">'+a.unique+'</div><p>Activités explorées</p></div></div><div class="card"><h3>Mes résultats au fil du temps</h3>'+(h.length>=2?'<p>Premières activités : <b>'+early+' %</b> · Dernières activités : <b>'+late+' %</b></p><p class="muted">Compare tes résultats et repère tes progrès, sans te comparer aux autres.</p>':'<p class="muted">Termine deux activités pour commencer à observer ton évolution.</p>')+'<div class="adventure-history">'+h.slice(-12).map(x=>'<div title="'+new Date(x.date).toLocaleDateString('fr-FR')+'" style="height:'+Math.max(8,x.score)+'%"><span>'+x.score+'%</span></div>').join('')+'</div></div><div class="card"><h3>Historique récent</h3>'+(h.length?h.slice(-10).reverse().map(x=>'<p><span class="badge">'+esc(x.level)+'</span> '+esc(x.kind)+' · <b>'+x.score+' %</b> · '+new Date(x.date).toLocaleDateString('fr-FR')+'</p>').join(''):'<p class="muted">Ta première mission t’attend !</p>')+'<div class="btnrow">'+button('Exporter mes données','exportData()','alt')+button('Importer une sauvegarde',"$('#importFile').click()",'alt')+'<input type="file" id="importFile" class="hidden" accept=".json,application/json" onchange="importData(this.files[0])"></div></div>'}

function brevet(){return `<section class="hero"><span class="badge">COLLECTION 2018</span><h1>🏅 Objectif Brevet</h1><p>Cinq sujets officiels du DNB 2018. Pour respecter les droits des œuvres, ajoute le texte depuis ton exemplaire dans l’espace local : il ne sera pas publié avec l’application.</p></section><div class="grid">${annales2018.map(a=>{let d=state.custom.find(x=>x.annaleId===a.id);return `<div class="card"><span class="badge">DNB ${a.year} · ${a.points} points · ${a.duration} min</span><h3>${esc(a.title)}</h3><p><b>${esc(a.author)}</b> — <i>${esc(a.work)}</i></p><p class="muted">Référence : ${esc(a.code)}</p><p><b>Avant la dictée :</b> ${esc(a.notes)}</p><p><b>À travailler :</b> ${esc(a.focus)}</p><div class="btnrow">${d?button('▶ S’entraîner',`mode='classic';startDict('${d.id}')`):button('Ajouter le texte',`prepareAnnale('${a.id}')`)}${d?button('Brevet blanc',`startDict('${d.id}',true)`,'pink'):''}${d?button('Remplacer le texte',`prepareAnnale('${a.id}')`,'alt'):''}</div></div>`}).join('')}</div><div class="card"><h3>Comment fonctionne l’entraînement ?</h3><p>1. Colle le texte de ton document officiel dans la fiche choisie. 2. Écoute avec la voix française du navigateur. 3. Écris puis vérifie ta dictée. 4. Recommence en mode brevet blanc. Les textes ajoutés sont enregistrés uniquement sur cet appareil et inclus dans ton export JSON.</p><p class="muted">La note sur 10 indiquée dans les annales est une référence officielle ; le score automatique de cette V1 reste un pourcentage indicatif et non un barème officiel.</p></div>`}
function prepareAnnale(id){let a=annales2018.find(x=>x.id===id);if(!a)return;let old=state.custom.find(x=>x.annaleId===id);$('#app').innerHTML=`<div class="btnrow">${button('◀ Retour aux annales',"nav('brevet')",'alt')}</div><div class="card"><span class="badge">${esc(a.code)}</span><h2>${esc(a.title)}</h2><p>${esc(a.author)} — ${esc(a.work)}</p><p class="feedback">${esc(a.notes)}</p><label class="label" for="annaleText">Texte de la dictée (à coller depuis ton exemplaire)</label><textarea class="field" id="annaleText" rows="12" spellcheck="false" placeholder="Colle ici le texte officiel…">${esc(old?.text||'')}</textarea><label class="label" for="annaleAudio">Audio personnel facultatif (3 Mo maximum)</label><input type="file" class="field" id="annaleAudio" accept="audio/*"><div class="btnrow">${button('Enregistrer et entraîner',`saveAnnale('${id}')`,'pink')}</div><p class="muted">Les textes et fichiers audio restent locaux et ne sont pas envoyés à un serveur.</p></div>`}
function saveAnnale(id){let a=annales2018.find(x=>x.id===id),t=$('#annaleText').value.trim(),f=$('#annaleAudio').files[0];if(!t)return toast('Colle d’abord le texte de l’annale.');if(f&&f.size>3000000)return toast('Audio trop volumineux (maximum 3 Mo).');let d=state.custom.find(x=>x.annaleId===id);if(!d){d={id:'annale-'+id,annaleId:id};state.custom.push(d)}Object.assign(d,{title:'Brevet 2018 — '+a.title,level:'3e',topic:'Brevet',text:t,explain:a.focus,source:a.code,notes:a.notes});function done(){save();mode='classic';startDict(d.id);toast('Annale enregistrée localement.')}if(f){let r=new FileReader();r.onload=()=>{d.audio=r.result;done()};r.readAsDataURL(f)}else done()}
function teacher(){return `<section class="hero"><h1>Studio professeur</h1><p>Crée tes dictées, choisis une voix et partage-les en un lien élève ou par export JSON.</p></section><div class="twocol" style="margin-top:20px"><div class="card"><h2>Créer une dictée</h2><label class="label">Titre</label><input id="tTitle" class="field" placeholder="Ex. La forêt mystérieuse"><label class="label">Classe</label><select id="tLevel" class="field">${['6e','5e','4e','3e'].map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select><label class="label">Compétence dominante</label><select id="tTopic" class="field">${['Accords','Conjugaison','Homophones','Lexique','Ponctuation','Brevet'].map(x=>`<option>${x}</option>`).join('')}</select><label class="label">Texte de la dictée</label><textarea id="tText" class="field" placeholder="Saisis le texte complet… Utilise Entrée pour signaler un nouveau paragraphe."></textarea><label class="label">Conseil pédagogique</label><textarea id="tExplain" class="field" style="min-height:80px" placeholder="Règle à revoir…"></textarea><label class="label">Audio enregistré (facultatif, MP3, WAV, M4A…)</label><input type="file" id="tAudio" class="field" accept="audio/*"><p class="muted">Sans fichier audio, l’application utilisera la synthèse vocale française.</p><div class="btnrow">${button('Enregistrer la dictée','addDict()')}${button('Tester la voix',"speak($('#tText').value||'Bienvenue dans Dictéo !')",'alt')}</div></div><div class="card"><h2>Ma bibliothèque</h2><p class="muted">${state.custom.length} dictée(s) personnalisée(s) · ${built.length} dictées de démonstration</p>${state.custom.map(d=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${esc(d.title)}</b><p class="muted">${esc(d.level)} · ${esc(d.topic)}</p><div class="btnrow">${button('Essayer',`mode='classic';startDict('${d.id}')`,'alt small')}${button('🔗 Lien élève',`shareDict('${d.id}')`,'alt small')}${button('Supprimer',`deleteDict('${d.id}')`,'alt small')}</div></div>`).join('')}<h3>Sauvegardes et partage</h3><div class="btnrow">${button('Exporter JSON','exportData()','alt')}${button('Importer JSON',"$('#teacherImport').click()",'alt')}<input type="file" id="teacherImport" class="hidden" accept=".json,application/json" onchange="importData(this.files[0])"></div><p class="muted">« Lien élève » copie une adresse qui ouvre directement la dictée chez l’élève (texte et consigne, sans l’audio enregistré). Les dictées et fichiers audio importés sont stockés localement. Les enregistrements longs peuvent dépasser la capacité de stockage du navigateur : conserve des exports réguliers.</p></div></div>`}
function addDict(){let title=$('#tTitle').value.trim(),text=$('#tText').value.trim();if(!title||!text)return toast('Indique un titre et un texte.');let file=$('#tAudio').files[0];if(file&&file.size>3e6)return toast('Audio trop volumineux (maximum 3 Mo dans cette version).');let d={id:'custom-'+Date.now(),title,level:$('#tLevel').value,topic:$('#tTopic').value,text,explain:$('#tExplain').value.trim()};function done(){state.custom.push(d);save();toast('Dictée enregistrée !');render()}if(file){let reader=new FileReader();reader.onload=()=>{d.audio=reader.result;done()};reader.readAsDataURL(file)}else done()}function deleteDict(id){if(!confirm('Supprimer cette dictée personnalisée ?'))return;state.custom=state.custom.filter(x=>x.id!==id);save();render()}function exportData(){let blob=new Blob([JSON.stringify({app:'DICTEO',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='dicteo-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!['DICTEO','DICTEO_POP'].includes(data.app)||!data.data||!Array.isArray(data.data.history)||!Array.isArray(data.data.custom))throw Error();if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;state={...state,...data.data};save();render();toast('Sauvegarde importée.')}catch{toast('Fichier de sauvegarde invalide.')}};r.readAsText(file)}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
if(!loadShared())render();
</script></body></html>
