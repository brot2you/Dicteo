:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#232447;background:#f4f2ff}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.logo{font-size:clamp(25px,4vw,42px);font-weight:1000;letter-spacing:-2px;color:#6946e8}.logo span{color:#fb6990}.sub{font-size:12px;font-weight:800;letter-spacing:2px;color:#77769b}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.nav button,.pill{border:0;border-radius:14px;background:white;color:#49476d;padding:12px 15px;font-weight:800;box-shadow:0 3px 12px #332c7310}.nav button.active{background:#6946e8;color:white}.hero{background:linear-gradient(120deg,#6546e8,#9563f4 55%,#fa76a0);color:white;padding:32px;border-radius:28px;position:relative;overflow:hidden}.hero h1{font-size:clamp(26px,4vw,46px);margin:5px 0}.hero p{max-width:620px;line-height:1.6}.hero:after{content:'✦ ✎ ✦';position:absolute;right:30px;top:30px;font-size:70px;opacity:.25;transform:rotate(-15deg)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 7px 25px #31286610;border:1px solid #e8e3ff}.card h3{margin:8px 0}.card p,.muted{color:#777591;line-height:1.5}.emoji{font-size:34px}.btn{border:0;border-radius:14px;background:#6946e8;color:white;padding:12px 18px;font-weight:850}.btn.alt{background:#f0ebff;color:#6042d8}.btn.pink{background:#f65790}.btn.green{background:#18a989}.btn.small{padding:8px 11px;font-size:13px}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.field{width:100%;border:2px solid #e6e1f9;border-radius:13px;padding:12px;background:white;color:#262344}.field:focus{outline:3px solid #d7cbff}textarea.field{min-height:130px;resize:vertical;line-height:1.65}.sectiontitle{font-size:25px;margin:28px 0 10px}.badge{display:inline-block;background:#f0eaff;color:#6442d8;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:800}.modecard{transition:transform .15s}.modecard:hover{transform:translateY(-3px)}.progress{height:12px;border-radius:20px;background:#ece9fa;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#6946e8,#fa6ca1)}.choice{display:block;width:100%;text-align:left;background:#faf9ff;border:2px solid #e8e3ff;padding:13px;border-radius:12px;margin:9px 0;color:#292547;font-weight:700}.choice.selected{border-color:#6946e8;background:#eee8ff}.choice.good{border-color:#1eaa85;background:#e3fbf1}.choice.bad{border-color:#f66c83;background:#fff0f3}.feedback{border-radius:14px;background:#f0ebff;padding:15px;margin:15px 0;line-height:1.6}.feedback.ok{background:#e7faf0}.feedback.warn{background:#fff2e8}.label{display:block;font-size:13px;font-weight:850;color:#5e5b7d;margin:13px 0 6px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none!important}.score{font-size:45px;font-weight:950;color:#6546e8}.foot{text-align:center;padding:35px;color:#9892b0;font-size:12px}.word{display:inline-block;border:1px solid #e5ddfb;padding:7px 10px;border-radius:9px;margin:3px;background:#faf8ff;cursor:pointer}.word.found{background:#ffe5eb;border-color:#f46c8b}.stat{font-size:26px;font-weight:950;color:#6546e8}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e2957;color:white;padding:13px 20px;border-radius:14px;z-index:10;box-shadow:0 8px 20px #0002}.errorword{background:#ffe0e6;color:#9e2350;border-radius:4px;padding:2px}.kbd{font-size:13px;color:#797397}hr{border:0;border-top:1px solid #eee9fb;margin:20px 0}@media(max-width:650px){.shell{padding:12px}.hero{padding:23px}.hero:after{display:none}.twocol{grid-template-columns:1fr}.nav{gap:5px}.nav button{font-size:12px;padding:10px}.card{padding:17px}}
</style></head><body><div class="shell"><header class="top"><div><div class="logo">DICTÉO<span>POP</span> ✦</div><div class="sub">BY BROT2YOU · LE LABO DES MOTS</div></div><div><span class="badge" id="headlevel">5e</span> <span class="badge" id="headxp">0 XP</span></div></header><nav class="nav" id="nav"></nav><main id="app"></main><footer class="foot">DICTÉO POP by BROT2YOU · V1 jouable · Données enregistrées sur cet appareil</footer></div><script>
const KEY='dicteopop_v1';const built=[
{id:'d6a',level:'6e',title:'Le jardin secret',topic:'Accords',text:'Les petits oiseaux chantent dans le jardin. Une fleur rouge pousse près de la maison. Les enfants regardent les papillons.',explain:'Le sujet au pluriel commande souvent une terminaison verbale au pluriel.'},
{id:'d6b',level:'6e',title:'La bibliothèque',topic:'Lexique',text:'Chaque matin, Camille ouvre un grand livre. Elle découvre une histoire merveilleuse et dessine un château.',explain:'Observe les lettres doubles et les accents.'},
{id:'d5a',level:'5e',title:'Le voyage',topic:'Conjugaison',text:'Hier, nous avons visité un village ancien. Les habitants nous ont raconté des histoires étonnantes. Nous sommes rentrés heureux.',explain:'Attention aux auxiliaires et aux accords des participes passés.'},
{id:'d5b',level:'5e',title:'Une journée pluvieuse',topic:'Homophones',text:'À midi, Léa a fermé sa fenêtre. Ses amis sont restés chez elle et ont préparé un gâteau.',explain:'Distingue à et a, sont et son, ses et ces.'},
{id:'d4a',level:'4e',title:'La découverte',topic:'Accords',text:'Les exploratrices, surprises par la lumière, ont découvert une salle oubliée. Elles avaient longtemps cherché cette entrée.',explain:'Repère les chaînes d’accords et les temps composés.'},
{id:'d4b',level:'4e',title:'La ville endormie',topic:'Ponctuation',text:'Lorsque la nuit tomba, les rues devinrent silencieuses. Pourtant, derrière les fenêtres, quelques lumières brillaient encore.',explain:'Les virgules organisent les propositions.'},
{id:'d3a',level:'3e',title:'Le carnet retrouvé',topic:'Brevet',text:'Bien qu’ils aient parcouru des kilomètres, les voyageurs n’avaient pas oublié les promesses qu’ils s’étaient faites.',explain:'Observe les subordonnées et les accords des participes passés.'},
{id:'d3b',level:'3e',title:'L’aube',topic:'Brevet',text:'À l’aube, les maisons que nous avions aperçues semblaient désertes. Personne ne savait ce qui s’était produit pendant la nuit.',explain:'Attention aux participes passés et aux formes pronominales.'},
{"id":"orig3e2026_01","level":"3e","title":"3e · La lettre oubliée","topic":"Consolidation — Accords","text":"Chaque soir, les voisins se retrouvaient devant la petite maison. Ils échangeaient quelques nouvelles et observaient les lumières du village. Un matin, une enveloppe mystérieuse apparut sur le banc. Personne ne savait qui l'avait déposée. Les enfants, intrigués, décidèrent de prévenir leurs parents avant de l'ouvrir.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords."},
{"id":"orig3e2026_02","level":"3e","title":"3e · Au bord du lac","topic":"Consolidation — Homophones","text":"À l'aube, Léa a rejoint ses amis près du lac. Ils sont venus avec leurs vélos et ont posé leurs sacs sur l'herbe. Le soleil se levait lentement, et ses reflets éclairaient l'eau calme. Chacun voulait profiter de cette journée, mais personne n'avait oublié les consignes de sécurité.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : homophones."},
{"id":"orig3e2026_03","level":"3e","title":"3e · La cour silencieuse","topic":"Consolidation — Imparfait","text":"Les élèves attendaient devant le portail tandis que les arbres perdaient leurs dernières feuilles. Une pluie fine tombait sur les bancs vides. Le gardien ouvrait toujours les portes à la même heure. Ce matin-là, pourtant, rien ne semblait habituel : les couloirs demeuraient silencieux et les fenêtres étaient encore fermées.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : imparfait."},
{"id":"orig3e2026_04","level":"3e","title":"3e · Le vieux vélo","topic":"Consolidation — Participes passés","text":"Mon frère avait retrouvé un vélo abandonné derrière la grange. Il l'a nettoyé avec soin, puis il a réparé les freins. Nos parents sont venus admirer son travail. Les roues, couvertes de poussière, brillaient enfin. Le lendemain, nous sommes partis ensemble sur le chemin qui longeait les champs.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : participes passés."},
{"id":"orig3e2026_05","level":"3e","title":"3e · Le marché du samedi","topic":"Consolidation — Lexique","text":"Sous les auvents colorés, les marchands disposaient des paniers remplis de fruits. Une odeur de pain chaud flottait dans les allées. Les clients choisissaient leurs provisions et échangeaient des sourires. Malgré le bruit de la foule, une vieille musicienne jouait doucement près de la fontaine, attirant les passants curieux.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : lexique."},
{"id":"orig3e2026_06","level":"3e","title":"3e · La gare déserte","topic":"Intermédiaire — Temps du récit","text":"Lorsque le dernier train quitta la gare, un silence étrange s'installa. Nous avions attendu longtemps sur le quai, sans comprendre pourquoi personne ne venait. Les horloges indiquaient minuit. Soudain, une porte s'ouvrit au fond du bâtiment, et une silhouette apparut sous la lumière vacillante d'une lampe.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : temps du récit."},
{"id":"orig3e2026_07","level":"3e","title":"3e · Les photos retrouvées","topic":"Intermédiaire — Accords","text":"Les photographies que ma grand-mère avait conservées racontaient une histoire oubliée. Certaines montraient des rues disparues, d'autres représentaient des visages inconnus. Nous les avons regardées attentivement. Les légendes, écrites à l'encre bleue, nous ont permis de reconnaître plusieurs membres de notre famille.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords."},
{"id":"orig3e2026_08","level":"3e","title":"3e · Un orage en montagne","topic":"Intermédiaire — Conjugaison","text":"Nous marchions depuis deux heures lorsque les nuages recouvrirent les sommets. Le vent s'était levé brusquement et les premières gouttes frappaient les rochers. Notre guide nous demanda de rester groupés. Bien que le sentier fût encore visible, nous décidâmes de redescendre avant que l'orage ne gagne la vallée.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : conjugaison."},
{"id":"orig3e2026_09","level":"3e","title":"3e · La représentation","topic":"Intermédiaire — Homophones","text":"Ce soir-là, les comédiens se préparaient derrière le rideau. Chacun connaissait son rôle, mais certains craignaient d'oublier leurs répliques. Le public était déjà installé, et l'on entendait des murmures dans la salle. Quand les lumières se sont éteintes, tous ont retenu leur souffle avant la première scène.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : homophones."},
{"id":"orig3e2026_10","level":"3e","title":"3e · Le carnet de voyage","topic":"Intermédiaire — Ponctuation","text":"Dans mon carnet, j'avais noté les noms des villes traversées, les rencontres inattendues et les paysages admirés. Pourtant, aucun mot ne suffisait à décrire cette vallée. Les maisons semblaient suspendues au-dessus du fleuve. Je compris alors que certains souvenirs, même soigneusement racontés, gardent une part de mystère.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : ponctuation."},
{"id":"orig3e2026_11","level":"3e","title":"3e · La maison aux volets bleus","topic":"Brevet — Accords complexes","text":"Lorsque nous sommes revenus au village, la maison que nous avions connue paraissait abandonnée. Les volets bleus, autrefois soigneusement repeints, étaient maintenant couverts de poussière. Des herbes avaient poussé entre les pierres. Ma sœur s'est arrêtée devant le portail, émue par les souvenirs qui lui revenaient soudain.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords complexes."},
{"id":"orig3e2026_12","level":"3e","title":"3e · La nuit des étoiles","topic":"Brevet — Subordination","text":"Bien que le ciel se fût assombri, les jeunes astronomes avaient installé leurs instruments sur la colline. Ils espéraient apercevoir une pluie d'étoiles filantes dont leur professeur leur avait parlé. Lorsque les nuages se dissipèrent enfin, une lumière traversa l'horizon. Tous demeurèrent silencieux, fascinés par ce spectacle inattendu.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : subordination."},
{"id":"orig3e2026_13","level":"3e","title":"3e · La décision","topic":"Brevet — Temps verbaux","text":"Depuis plusieurs semaines, Inès hésitait à participer au concours. Ses amis l'avaient encouragée, mais elle doutait encore de ses capacités. Le matin de l'inscription, elle relut les textes qu'elle avait écrits. Puis, sans prévenir personne, elle franchit la porte du bureau et déposa son dossier.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : temps verbaux."},
{"id":"orig3e2026_14","level":"3e","title":"3e · Les arbres du souvenir","topic":"Brevet — Participes passés","text":"Les arbres que les habitants avaient plantés après la tempête étaient devenus immenses. Leurs branches s'étendaient au-dessus des chemins reconstruits. Chaque année, les familles se réunissaient pour raconter ce qu'elles avaient vécu. Les enfants écoutaient ces récits avec attention, conscients que le paysage gardait la mémoire des événements.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : participes passés."},
{"id":"orig3e2026_15","level":"3e","title":"3e · L'inconnu du quai","topic":"Brevet — Orthographe lexicale","text":"Un homme vêtu d'un manteau sombre attendait près de la voie ferrée. Il tenait une valise ancienne dont la poignée semblait fragile. Les voyageurs, pressés de rentrer, passaient devant lui sans le remarquer. Pourtant, son regard inquiet et son immobilité donnaient à cette scène ordinaire une atmosphère singulièrement mystérieuse.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : orthographe lexicale."},
{"id":"orig3e2026_16","level":"3e","title":"3e · Les promesses du printemps","topic":"Expert — Subordination","text":"Quelles que fussent les difficultés rencontrées pendant l'hiver, les habitants n'avaient jamais renoncé à reconstruire leur jardin collectif. Les graines qu'ils avaient soigneusement protégées commençaient à germer. Chacun apportait les outils dont il disposait, tandis que les plus jeunes préparaient les parcelles où pousseraient bientôt les premières fleurs.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : subordination."},
{"id":"orig3e2026_17","level":"3e","title":"3e · L'atelier fermé","topic":"Expert — Accords complexes","text":"Les lettres qu'elle avait écrites étaient restées dans le tiroir où elle les avait rangées. Elle s'était promis de les envoyer, mais les semaines s'étaient succédé sans qu'elle trouvât le courage de le faire. Lorsqu'elle les relut enfin, certaines phrases lui parurent étrangères, comme si quelqu'un d'autre les avait composées.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : accords complexes."},
{"id":"orig3e2026_18","level":"3e","title":"3e · Le passage secret","topic":"Expert — Temps du récit","text":"À peine avions-nous franchi l'étroite ouverture que la porte se referma derrière nous. Les marches, usées par des siècles de passages, descendaient vers une salle obscure. Nous ignorions où conduisait cet escalier, mais les inscriptions gravées dans la pierre semblaient indiquer qu'il avait autrefois servi de refuge.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : temps du récit."},
{"id":"orig3e2026_19","level":"3e","title":"3e · La dernière répétition","topic":"Expert — Homophones et accords","text":"Quoiqu'ils se fussent entraînés durant des mois, les musiciens redoutaient encore la représentation. Chacun vérifiait les partitions qu'on lui avait confiées. Les instruments, accordés avec précision, attendaient sur la scène. Dès que la cheffe d'orchestre leva les mains, les conversations cessèrent et une harmonie inattendue emplit la salle.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : homophones et accords."},
{"id":"orig3e2026_20","level":"3e","title":"3e · L'horizon retrouvé","topic":"Expert — Syntaxe","text":"Ceux qui avaient quitté la région depuis longtemps reconnaissaient à peine les chemins qu'ils parcouraient autrefois. Là où s'étendaient des terrains abandonnés, des jardins avaient été aménagés. Les habitants s'étaient organisés pour préserver ces espaces, convaincus que les générations futures sauraient apprécier les efforts accomplis.","explain":"Relis attentivement les accords, les temps verbaux et la ponctuation. Difficulté ciblée : syntaxe."}];
const lessons=[['Accord sujet-verbe','Le verbe s’accorde en personne et en nombre avec son sujet.','Les enfants jouent.','Les enfants joue.'],['Accord dans le groupe nominal','Le déterminant, le nom et l’adjectif s’accordent en genre et en nombre.','Les grandes maisons.','Les grande maisons.'],['a / à','Remplace « a » par « avait » : si cela fonctionne, écris a sans accent.','Elle a un livre.','Elle à un livre.'],['et / est','« est » est une forme du verbe être ; « et » relie des éléments.','Il est calme et poli.','Il et calme est poli.'],['son / sont','« sont » peut être remplacé par « étaient ».','Ils sont avec son frère.','Ils son avec sont frère.'],['Participe passé avec être','Avec être, le participe passé s’accorde généralement avec le sujet.','Elles sont parties.','Elles sont parti.'],['Imparfait','À la troisième personne du pluriel, l’imparfait se termine par -aient.','Ils chantaient.','Ils chantait.'],['Pluriel des noms','La plupart des noms prennent -s au pluriel, mais il existe des exceptions.','Des jardins.','Des jardin.']];
const questions=[{type:'duel',q:'Choisis la phrase correctement écrite.',opts:['Les enfants joue dehors.','Les enfants jouent dehors.','Les enfant jouent dehors.'],a:1,why:'« Les enfants » est pluriel : jouent.'},{type:'duel',q:'Choisis la bonne orthographe.',opts:['Ils sont arrivés.','Ils son arrivés.','Ils sont arrivé.'],a:0,why:'« sont » est le verbe être ; le participe s’accorde avec le sujet.'},{type:'accord',q:'Les filles ___ dans la cour.',opts:['joue','jouent','joues'],a:1,why:'Le sujet « les filles » est au pluriel.'},{type:'accord',q:'Elle ___ un nouveau cahier.',opts:['à','as','a'],a:2,why:'« a » peut être remplacé par « avait ».'},{type:'accord',q:'Des fleurs ___ poussent ici.',opts:['rouges','rouge','rougées'],a:0,why:'L’adjectif s’accorde avec « fleurs » au féminin pluriel.'},{type:'duel',q:'Quelle phrase est correcte ?',opts:['Nous avons marcher.','Nous avons marché.','Nous avont marché.'],a:1,why:'Après l’auxiliaire avoir, on utilise le participe passé « marché ».'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state={level:'5e',xp:0,history:[],custom:[],name:'Explorateur',...state};let page='home',active=null,mode='classic',qIndex=0,chosen=null,answers=[],audioUrl=null,recordedBlob=null,recorder=null,chunks=[],listenCount=0;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#headxp').textContent=state.xp+' XP';$('#headlevel').textContent=state.level}catch{toast('Stockage plein : exporte une sauvegarde.')}}function toast(t){document.querySelector('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3200)}function nav(p){stopAudio();page=p;active=null;render()}function all(){return [...built,...state.custom]}function items(){return all().filter(d=>d.level===state.level)}function button(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function render(){let navs=[['home','⌂ Accueil'],['learn','◈ J’apprends'],['play','✦ Je joue'],['test','✓ Je me teste'],['progress','▥ Mes progrès'],['teacher','⚙ Espace prof'],['brevet','🏅 Objectif Brevet']];$('#nav').innerHTML=navs.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="nav('${id}')">${t}</button>`).join('');let h='';if(page==='home')h=home();if(page==='learn')h=learn();if(page==='play')h=play();if(page==='test')h=selectDict(true);if(page==='progress')h=progress();if(page==='teacher')h=teacher();if(page==='brevet')h=brevet();if(page==='exercise')h=exercise();if(page==='result')h=resultView();if(page==='remediation')h=remediationView();$('#app').innerHTML=h;$('#headlevel').textContent=state.level;$('#headxp').textContent=state.xp+' XP'}
function home(){return `<section class="hero"><span class="badge">BIENVENUE DANS L’AVENTURE</span><h1>Deviens un as des mots !</h1><p>Écoute, écris, découvre les règles et relève des défis. Chaque erreur peut devenir une nouvelle victoire.</p>${button('▶ Commencer à jouer',"nav('play')",'pink')}</section><h2 class="sectiontitle">Ton parcours</h2><div class="card"><label class="label" for="level">Choisis ta classe</label><select id="level" class="field" onchange="state.level=this.value;save();render()">${['6e','5e','4e','3e'].map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select><div class="grid"><div><div class="stat">${state.xp} XP</div><div class="muted">Points gagnés</div></div><div><div class="stat">${state.history.length}</div><div class="muted">Défis terminés</div></div><div><div class="stat">${new Set(state.history.map(x=>x.id)).size}</div><div class="muted">Activités explorées</div></div></div></div><h2 class="sectiontitle">À découvrir</h2><div class="grid">${[['📚','J’apprends','Découvre les règles','learn'],['🎮','Je joue','Huit façons de progresser','play'],['🏆','Je me teste','Une vraie dictée à réussir','test']].map(x=>`<div class="card modecard"><div class="emoji">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p>${button('Explorer',`nav('${x[3]}')`,'alt')}</div>`).join('')}</div>`}
function learn(){return `<section class="hero"><h1>Le laboratoire des règles</h1><p>Observe les exemples, comprends les pièges et vérifie tes connaissances.</p></section><div class="grid">${lessons.map((l,i)=>`<div class="card"><span class="badge">LEÇON ${i+1}</span><h3>${esc(l[0])}</h3><p>${esc(l[1])}</p><p style="color:#15966e">✓ ${esc(l[2])}</p><p style="color:#d35b78">✕ ${esc(l[3])}</p>${button('Mini-défi',`startQuiz('duel',${i%questions.length})`,'alt small')}</div>`).join('')}</div>`}
const modes=[['classic','✍️','Dictée classique','Écoute et écris tout le texte'],['gap','🧩','Dictée à trous','Complète les mots manquants'],['hunt','🔎','Chasse aux fautes','Retrouve les erreurs'],['duel','⚔️','Duel des mots','Choisis la bonne écriture'],['accord','🔗','Accords en folie','Accorde les mots'],['flash','⚡','Dictée flash','Mémorise puis écris'],['mystery','🔮','Phrase mystère','Remets les mots en ordre'],['boss','👑','Boss final','Un mélange de défis']];function play(){return `<section class="hero"><h1>L’arène des mots</h1><p>Choisis ton défi. Les points récompensent les progrès et les efforts !</p></section><div class="grid">${modes.map(m=>`<div class="card modecard"><div class="emoji">${m[1]}</div><h3>${m[2]}</h3><p>${m[3]}</p>${button('Jouer',`selectMode('${m[0]}')`,'alt')}</div>`).join('')}</div>`}function selectMode(m){mode=m;if(['duel','accord','boss'].includes(m))startQuiz(m);else{page='exercise';active=null;render()}}function selectDict(test=false){return `<section class="hero"><h1>${test?'Le grand test':'Choisis ta dictée'}</h1><p>${test?'Une évaluation complète, sans afficher le texte avant la correction.':'Des textes adaptés à ton niveau.'}</p></section><div class="grid">${items().map(d=>`<div class="card"><span class="badge">${esc(d.level)} · ${esc(d.topic)}</span><h3>${esc(d.title)}</h3><p>${d.text.split(/\s+/).length} mots · ${test?'Évaluation':'Entraînement'}</p>${button('Commencer',`startDict('${d.id}',${test})`)}</div>`).join('')}</div>${!items().length?'<div class="card">Aucune dictée à ce niveau. Ajoute-en dans l’espace professeur.</div>':''}`}
function startDict(id,test=false){active=all().find(x=>x.id===id);if(!active)return;mode=test?'test':mode;listenCount=0;page='exercise';render()}function stopAudio(){speechSynthesis?.cancel?.();if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}}function speak(text){if(!('speechSynthesis'in window)){toast('Synthèse vocale indisponible sur ce navigateur.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=Number($('#rate')?.value||.85);let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;speechSynthesis.speak(u);listenCount++}function playSound(){if(active?.audio){let a=new Audio(active.audio);a.play().catch(()=>toast('Impossible de lire cet enregistrement.'))}else speak(active?.text||'')}function sentence(){let ss=active.text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[active.text];let i=Number($('#sentenceNum')?.value||0);if(active.audio){toast('Le découpage par phrase nécessite la synthèse vocale.');speak(ss[i]||ss[0])}else speak(ss[i]||ss[0])}
function exercise(){if(!active&&['classic','gap','hunt','flash','mystery'].includes(mode))return selectDict(false);if(!active&&mode==='test')return selectDict(true);if(!active)return '<div class="card">Choisis une dictée.</div>';const d=active;let common=`<div class="btnrow">${button('◀ Changer de dictée',"active=null;render()",'alt')}<span class="badge">${esc(d.level)} · ${esc(d.topic)}</span></div><h2>${esc(d.title)}</h2>`;let audio=`<div class="card"><h3>🔊 Écoute</h3><div class="btnrow">${button('▶ Écouter', 'playSound()')}${button('⏹ Arrêter', 'stopAudio()','alt')}${button('↻ Répéter', 'playSound()','alt')}</div><label class="label">Vitesse de lecture (voix de synthèse)</label><input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="0.85" aria-label="Vitesse de lecture"><label class="label">Écouter une phrase</label><div class="btnrow"><select id="sentenceNum" class="field" style="max-width:160px">${(d.text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[d.text]).map((_,i)=>`<option value="${i}">Phrase ${i+1}</option>`).join('')}</select>${button('▶ Phrase','sentence()','alt')}</div></div>`;if(mode==='classic'||mode==='test')return common+audio+`<div class="card"><h3>✍️ À toi d’écrire</h3><p class="muted">Écris le texte entendu. Les majuscules et la ponctuation sont également travaillées.</p><textarea id="response" class="field" placeholder="Écris ta dictée ici…" spellcheck="false" autocomplete="off"></textarea><div class="btnrow">${button('Corriger ma dictée','checkText()','pink')}</div></div>`;if(mode==='gap'){let words=d.text.split(/(\s+)/);let indexes=[];words.forEach((w,i)=>{if(/\p{L}/u.test(w)&&w.replace(/[^\p{L}]/gu,'').length>3&&indexes.length<5&&indexes.every(j=>i-j>3))indexes.push(i)});window.gapAnswers=indexes.map(i=>words[i]);return common+audio+`<div class="card"><h3>🧩 Complète les cinq mots</h3><p style="line-height:3">${words.map((w,i)=>indexes.includes(i)?`<input class="field gapinput" aria-label="Mot manquant" style="width:110px;display:inline-block;padding:7px" data-i="${indexes.indexOf(i)}" spellcheck="false">`:esc(w)).join('')}</p>${button('Vérifier','checkGaps()','pink')}</div>`}if(mode==='hunt'){let original=d.text.split(/(\s+)/),pos=[];original.forEach((w,i)=>{if(w.length>5&&pos.length<3&&pos.every(j=>i-j>5))pos.push(i)});window.huntPositions=pos;let shown=original.map((w,i)=>pos.includes(i)?w.replace(/[aeiouéè]/i,'')||w:w);return common+`<div class="card"><h3>🔎 Trouve les 3 mots mal orthographiés</h3><p class="muted">Clique sur les mots qui contiennent une erreur.</p><div id="huntwords" style="line-height:2.8">${shown.map((w,i)=>/^\s+$/.test(w)?' ':`<button class="word" data-i="${i}" onclick="this.classList.toggle('found')">${esc(w)}</button>`).join('')}</div>${button('Vérifier','checkHunt()','pink')}</div>`}if(mode==='flash'){return common+`<div class="card"><h3>⚡ Observe, mémorise, écris</h3><p class="muted">Lis la phrase, puis masque-la avant de l’écrire.</p><div id="flashphrase" class="feedback">${esc(d.text.split(/[.!?]/)[0]+'.')}</div><div class="btnrow">${button('Masquer la phrase',"$('#flashphrase').textContent='À toi de jouer !'",'alt')}</div><textarea id="response" class="field" spellcheck="false" placeholder="Réécris la phrase de mémoire…"></textarea>${button('Vérifier','checkFlash()','pink')}</div>`}if(mode==='mystery'){let sent=d.text.split(/[.!?]/)[0].trim(),arr=sent.split(/\s+/);window.mysteryWords=arr;window.mysterySelected=[];let shuffled=arr.map((w,i)=>({w,i})).sort((a,b)=>(a.i*7%arr.length)-(b.i*7%arr.length));if(shuffled.every((x,i)=>x.i===i))shuffled.reverse();return common+audio+`<div class="card"><h3>🔮 Reconstruis la première phrase</h3><p class="muted">Écoute et clique sur les mots dans le bon ordre.</p><div id="assembled" class="feedback" style="min-height:55px"></div><div id="tiles">${shuffled.map(x=>`<button class="word" data-i="${x.i}" onclick="pickWord(${x.i},this)">${esc(x.w)}</button>`).join('')}</div><div class="btnrow">${button('Effacer','resetMystery()','alt')}${button('Vérifier','checkMystery()','pink')}</div></div>`}return common}
function normalize(s){return String(s).toLocaleLowerCase('fr').normalize('NFC').replace(/[’]/g,"'").replace(/[^\p{L}\p{N}'\s-]/gu,' ').replace(/\s+/g,' ').trim()}function editDistance(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}function diff(expected,actual){let a=normalize(expected).split(' ').filter(Boolean),b=normalize(actual).split(' ').filter(Boolean),n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=n,j=m,errors=[];while(i||j){if(i&&j&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){if(a[i-1]!==b[j-1])errors.push({want:a[i-1],got:b[j-1],kind:'Mot différent'});i--;j--}else if(i&&dp[i][j]===dp[i-1][j]+1){errors.push({want:a[i-1],got:'—',kind:'Mot manquant'});i--}else{errors.push({want:'—',got:b[j-1],kind:'Mot ajouté'});j--}}return {errors:errors.reverse(),score:Math.round(100*(1-dp[n][m]/Math.max(1,n,m))),words:n}}function record(id,kind,score){state.history.push({id,kind,score,date:new Date().toISOString(),level:state.level});state.xp+=Math.max(5,Math.round(score/10));save()}function showResult(title,score,html,id=active?.id||mode){record(id,mode,score);window.lastResult={title,score,html};page='result';render()}function diagnoseError(e){const w=e.want,g=e.got;const pairs=[['a','à'],['et','est'],['son','sont'],['on','ont'],['ou','où'],['ce','se'],['ces','ses'],['leur','leurs'],['la','là']];if(e.kind==='Mot manquant')return {cat:'Mot oublié',tip:'Réécoute la phrase en suivant son sens, puis vérifie chaque mot.'};if(e.kind==='Mot ajouté')return {cat:'Mot supplémentaire',tip:'Compare ta phrase avec celle entendue et vérifie si ce mot est nécessaire.'};if(pairs.some(p=>p.includes(w)&&p.includes(g)))return {cat:'Homophones',tip:'Deux mots peuvent se prononcer de la même façon sans avoir le même rôle. Essaie de remplacer le mot par une autre forme : « a » par « avait », « est » par « était », « sont » par « étaient ».'};if(w.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===g.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {cat:'Accent',tip:'Observe la voyelle et son accent. Relis le mot correctement écrit et mémorise sa graphie.'};if(w.replace(/s$/,'')===g.replace(/s$/,'')||w.replace(/x$/,'')===g.replace(/x$/,''))return {cat:'Accord ou pluriel possible',tip:'Cherche le déterminant, le nom et le sujet : le nombre peut modifier la terminaison. Vérifie aussi si le -s fait partie du mot.'};if(/(aient|ait|ais|ons|ez|ent|é|ée|és|ées|er)$/.test(w)&&/(aient|ait|ais|ons|ez|ent|é|ée|és|ées|er)$/.test(g))return {cat:'Forme verbale ou accord possible',tip:'Identifie le sujet, le temps et la fonction du mot. Si c’est un participe passé, repère son auxiliaire.'};return {cat:'Orthographe à vérifier',tip:'Observe les lettres différentes, les éventuelles consonnes doubles et la famille du mot. La catégorie grammaticale doit être confirmée avec le contexte.'}}
function checkText(){let val=$('#response').value.trim();if(!val)return toast('Écris d’abord ta dictée.');let d=diff(active.text,val),errs=d.errors.map((e,i)=>({...e,...diagnoseError(e),n:i}));window.remediation={id:active.id,title:active.title,errors:errs,done:{}};state.weakWords=state.weakWords||[];for(const e of errs){if(e.want!=='—'&&!state.weakWords.some(x=>x.word===e.want&&x.source===active.id))state.weakWords.push({word:e.want,source:active.id,category:e.cat,date:new Date().toISOString()})}state.weakWords=state.weakWords.slice(-120);save();let html=`<h3>Ta correction détaillée</h3><p><b>Texte attendu :</b> ${esc(active.text)}</p><p><b>Ta réponse :</b> ${esc(val)}</p><p><b>${errs.length} écart(s)</b> repéré(s) sur ${d.words} mots.</p>`+(!errs.length?'<div class="feedback ok">Bravo ! Aucun écart détecté dans les mots.</div>':'')+errs.slice(0,35).map(e=>`<div class="feedback warn"><b>${esc(e.cat)}</b> · « ${esc(e.got)} » → <b>« ${esc(e.want)} »</b><p>${esc(e.tip)}</p></div>`).join('')+`<p>${esc(active.explain||'Relis les accords, les homophones et la conjugaison.')}</p><p class="muted">Analyse indicative : certaines catégories sont des hypothèses, à vérifier avec la phrase. Le score porte sur les mots et ne mesure pas la ponctuation ni les majuscules.</p>`;if(errs.some(e=>e.want!=='—'))html+=`<div class="card" style="background:#f4efff"><h3>🎯 Ton entraînement personnalisé</h3><p>Retrouve l’orthographe correcte des mots que tu viens de manquer, puis refais la dictée pour consolider tes acquis.</p>${button('Commencer mes exercices','startRemediation()','pink')}</div>`;showResult('Correction de la dictée',d.score,html)}
function startRemediation(){const r=window.remediation;if(!r||!r.errors.length)return toast('Aucune erreur à retravailler.');r.queue=r.errors.filter(e=>e.want!=='—').slice(0,12);r.index=0;r.done={};if(!r.queue.length)return toast('Aucun mot à compléter.');page='remediation';render()}
function remediationView(){const r=window.remediation;if(!r||!r.queue)return '<div class="card">Commence par corriger une dictée.</div>';const e=r.queue[r.index];if(!e)return `<section class="hero"><h1>Entraînement terminé !</h1><p>${Object.values(r.done).filter(Boolean).length} réponse(s) correcte(s) sur ${r.queue.length}. Reprends ensuite la dictée pour vérifier tes progrès.</p></section><div class="card"><div class="btnrow">${button('Refaire la dictée',`mode='classic';startDict('${r.id}')`,'pink')}${button('Mes progrès',"nav('progress')",'alt')}</div></div>`;return `<section class="hero"><h1>🎯 Atelier de remédiation</h1><p>Défi ${r.index+1} / ${r.queue.length} · ${esc(e.cat)}</p></section><div class="card"><h3>Retrouve le mot correct</h3><p>Tu avais écrit : <b>${esc(e.got)}</b></p><p>${esc(e.tip)}</p><label class="label" for="repairWord">Écris la forme correcte</label><input id="repairWord" class="field" spellcheck="false" autocomplete="off" placeholder="Ta correction…"><div id="repairFeedback" aria-live="polite"></div><div class="btnrow">${button('Vérifier','checkRepair()','pink')}<button id="repairNext" class="btn alt hidden" onclick="nextRepair()">Suivant →</button></div></div>`}
function checkRepair(){const r=window.remediation,e=r?.queue?.[r.index],input=$('#repairWord');if(!e||!input)return;const good=normalize(input.value)===normalize(e.want);r.done[r.index]=good;$('#repairFeedback').innerHTML=`<div class="feedback ${good?'ok':'warn'}">${good?'✓ Bien joué !':'À retenir :'} <b>${esc(e.want)}</b>. ${esc(e.tip)}</div>`;$('#repairNext').classList.remove('hidden');input.disabled=true;state.repairHistory=state.repairHistory||[];state.repairHistory.push({word:e.want,good,date:new Date().toISOString()});state.repairHistory=state.repairHistory.slice(-200);save()}
function nextRepair(){window.remediation.index++;render()}
function checkGaps(){let ins=[...document.querySelectorAll('.gapinput')];if(ins.some(x=>!x.value.trim()))return toast('Complète tous les mots.');let ok=0;let h=ins.map((x,i)=>{let good=normalize(x.value)===normalize(window.gapAnswers[i]);ok+=good;return `<p>${good?'✓':'✕'} ${esc(x.value)} → <b>${esc(window.gapAnswers[i])}</b></p>`}).join('');showResult('Dictée à trous',Math.round(ok/ins.length*100),h)}function checkHunt(){let picks=[...document.querySelectorAll('.word.found')].map(x=>+x.dataset.i);let correct=window.huntPositions;let tp=picks.filter(x=>correct.includes(x)).length,wrong=picks.filter(x=>!correct.includes(x)).length;showResult('Chasse aux fautes',Math.round(Math.max(0,tp-wrong)/correct.length*100),`<p>Tu as trouvé ${tp} des ${correct.length} mots modifiés, avec ${wrong} sélection(s) incorrecte(s).</p><p>Texte correct : ${esc(active.text)}</p>`)}function checkFlash(){let val=$('#response').value.trim();if(!val)return toast('Écris la phrase.');let expected=active.text.split(/[.!?]/)[0]+'.',d=diff(expected,val);showResult('Dictée flash',d.score,`<p><b>Phrase :</b> ${esc(expected)}</p><p><b>Ta réponse :</b> ${esc(val)}</p><p>${d.errors.length} écart(s) repéré(s).</p>`)}function pickWord(i,el){window.mysterySelected.push(i);el.disabled=true;$('#assembled').textContent=window.mysterySelected.map(i=>window.mysteryWords[i]).join(' ')}function resetMystery(){window.mysterySelected=[];document.querySelectorAll('#tiles .word').forEach(x=>x.disabled=false);$('#assembled').textContent=''}function checkMystery(){let a=window.mysterySelected,b=window.mysteryWords.map((_,i)=>i),good=a.filter((v,i)=>v===b[i]).length;showResult('Phrase mystère',Math.round(good/b.length*100),`<p><b>Phrase attendue :</b> ${esc(window.mysteryWords.join(' '))}</p><p><b>Ta proposition :</b> ${esc(a.map(i=>window.mysteryWords[i]).join(' '))}</p>`)}
function startQuiz(m,start=0){mode=m;qIndex=start;answers=[];chosen=null;page='exercise';active={id:'quiz-'+m,title:m==='boss'?'Le boss de l’orthographe':m==='accord'?'Accords en folie':'Duel des mots'};renderQuiz()}function pool(){return mode==='accord'?questions.filter(x=>x.type==='accord'):mode==='duel'?questions.filter(x=>x.type==='duel'):questions}function renderQuiz(){let arr=pool(),q=arr[qIndex%arr.length];let max=mode==='boss'?6:3;$('#app').innerHTML=`<div class="btnrow">${button('◀ Quitter',"nav('play')",'alt')}<span class="badge">Défi ${answers.length+1} / ${max}</span></div><div class="card"><div class="progress"><div style="width:${answers.length/max*100}%"></div></div><h2>${esc(active.title)}</h2><h3>${esc(q.q)}</h3><div id="choices">${q.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})">${esc(o)}</button>`).join('')}</div><div id="qfeedback"></div><div class="btnrow">${button('Valider','validateQuiz()','pink')}</div></div>`}function choose(i){chosen=i;document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',i===j))}function validateQuiz(){if(chosen===null)return toast('Choisis une réponse.');let arr=pool(),q=arr[qIndex%arr.length],ok=chosen===q.a;answers.push(ok);document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;el.classList.toggle('good',j===q.a);el.classList.toggle('bad',j===chosen&&!ok)});$('#qfeedback').innerHTML=`<div class="feedback ${ok?'ok':'warn'}"><b>${ok?'Bien joué !':'À revoir'}</b><p>${esc(q.why)}</p></div>`;document.querySelector('.btnrow:last-child').innerHTML=button(answers.length>=(mode==='boss'?6:3)?'Voir mon résultat':'Défi suivant','nextQuiz()');chosen=null}function nextQuiz(){if(answers.length>=(mode==='boss'?6:3)){let score=Math.round(answers.filter(Boolean).length/answers.length*100);showResult(active.title,score,`<p>${answers.filter(Boolean).length} bonne(s) réponse(s) sur ${answers.length}.</p><p>Rejoue pour consolider les règles.</p>`,active.id)}else{qIndex++;renderQuiz()}}function resultView(){let r=window.lastResult||{title:'Résultat',score:0,html:''};return `<section class="hero"><h1>Mission terminée ! ✨</h1><p>Chaque essai te fait progresser.</p></section><div class="card" style="margin-top:18px"><h2>${esc(r.title)}</h2><div class="score">${r.score}%</div><div class="progress"><div style="width:${r.score}%"></div></div><p class="muted">+${Math.max(5,Math.round(r.score/10))} XP</p><hr>${r.html}<div class="btnrow">${button('Autre défi',"nav('play')")}${button('Mes progrès',"nav('progress')",'alt')}</div></div>`}
function progress(){let h=state.history,avg=h.length?Math.round(h.reduce((a,x)=>a+x.score,0)/h.length):0;return `<section class="hero"><h1>Mes progrès</h1><p>Chaque activité compte. Reviens régulièrement sur tes difficultés.</p></section><div class="grid"><div class="card"><div class="stat">${state.xp}</div><p>XP gagnés</p></div><div class="card"><div class="stat">${h.length}</div><p>Activités terminées</p></div><div class="card"><div class="stat">${avg}%</div><p>Réussite moyenne</p></div></div><div class="card"><h3>Historique récent</h3>${h.length?h.slice(-15).reverse().map(x=>`<p><span class="badge">${esc(x.level)}</span> ${esc(x.kind)} · <b>${x.score}%</b> · ${new Date(x.date).toLocaleDateString('fr-FR')}</p>`).join(''):'<p class="muted">Termine une activité pour voir tes progrès.</p>'}<div class="btnrow">${button('Exporter mes données','exportData()','alt')}${button('Importer une sauvegarde',"$('#importFile').click()",'alt')}<input type="file" id="importFile" class="hidden" accept=".json,application/json" onchange="importData(this.files[0])"></div></div>`}
const annales2018=[
{id:'18-duteurtre',title:'Souvenirs des années 1960',author:'Benoît Duteurtre',work:'Livre pour adultes',year:'2018',code:'18GENFRDAN1',points:10,duration:20,notes:'Inscrire le titre, le nom de l’auteur et « 1960 » avant la dictée.',focus:'Imparfait, accords sujet-verbe, pluriels et participes passés.'},
{id:'18-ernaux',title:'Le progrès et les habitudes',author:'Annie Ernaux',work:'Les Années',year:'2018',code:'18GENFRDAG1',points:10,duration:20,notes:'Inscrire « Sofinco » au tableau avant la dictée.',focus:'Imparfait, accords, négation et vocabulaire.'},
{id:'18-colette',title:'Les bois de Montigny',author:'Colette',work:'Claudine à l’école',year:'2018',code:'18GENFRDIN1',points:10,duration:20,notes:'Inscrire « Montigny » et « Sapinière » ; préciser que « je » désigne un personnage féminin.',focus:'Accords au féminin, verbes au présent, ponctuation et lexique.'},
{id:'18-laferriere',title:'La fugue',author:'Dany Laferrière',work:'L’Odeur du café',year:'2018',code:'18PROFRDAG1',points:10,duration:20,notes:'Inscrire « Montilas », « Petite Guinée » et les références de l’œuvre.',focus:'Imparfait, passé composé, accords et homophones.'},
{id:'18-bailly',title:'Le tunnel',author:'Pierric Bailly',work:'L’Homme des bois',year:'2018',code:'18PROFRDME1',points:10,duration:20,notes:'Inscrire les références de l’œuvre avant la dictée.',focus:'Participes passés, accords nominaux, ponctuation et adjectifs.'}
];
function brevet(){return `<section class="hero"><span class="badge">COLLECTION 2018</span><h1>🏅 Objectif Brevet</h1><p>Cinq sujets officiels repérés dans les captures fournies. Pour respecter les droits des œuvres, ajoute le texte depuis ton exemplaire dans l’espace local : il ne sera pas publié avec l’application.</p></section><div class="grid">${annales2018.map(a=>{let d=state.custom.find(x=>x.annaleId===a.id);return `<div class="card"><span class="badge">DNB ${a.year} · ${a.points} points · ${a.duration} min</span><h3>${esc(a.title)}</h3><p><b>${esc(a.author)}</b> — <i>${esc(a.work)}</i></p><p class="muted">Référence : ${esc(a.code)}</p><p><b>Avant la dictée :</b> ${esc(a.notes)}</p><p><b>À travailler :</b> ${esc(a.focus)}</p><div class="btnrow">${d?button('▶ S’entraîner',`mode='classic';startDict('${d.id}')`):button('Ajouter le texte',`prepareAnnale('${a.id}')`)}${d?button('Brevet blanc',`startDict('${d.id}',true)`,'pink'):''}${d?button('Remplacer le texte',`prepareAnnale('${a.id}')`,'alt'):''}</div></div>`}).join('')}</div><div class="card"><h3>Comment fonctionne l’entraînement ?</h3><p>1. Colle le texte de ton document officiel dans la fiche choisie. 2. Écoute avec la voix française du navigateur. 3. Écris puis vérifie ta dictée. 4. Recommence en mode brevet blanc. Les textes ajoutés sont enregistrés uniquement sur cet appareil et inclus dans ton export JSON.</p><p class="muted">La note sur 10 indiquée dans les annales est une référence officielle ; le score automatique de cette V1 reste un pourcentage indicatif et non un barème officiel.</p></div>`}
function prepareAnnale(id){let a=annales2018.find(x=>x.id===id);if(!a)return;let old=state.custom.find(x=>x.annaleId===id);$('#app').innerHTML=`<div class="btnrow">${button('◀ Retour aux annales',"nav('brevet')",'alt')}</div><div class="card"><span class="badge">${esc(a.code)}</span><h2>${esc(a.title)}</h2><p>${esc(a.author)} — ${esc(a.work)}</p><p class="feedback">${esc(a.notes)}</p><label class="label" for="annaleText">Texte de la dictée (à coller depuis ton exemplaire)</label><textarea class="field" id="annaleText" rows="12" spellcheck="false" placeholder="Colle ici le texte officiel…">${esc(old?.text||'')}</textarea><label class="label" for="annaleAudio">Audio personnel facultatif (3 Mo maximum)</label><input type="file" class="field" id="annaleAudio" accept="audio/*"><div class="btnrow">${button('Enregistrer et entraîner',`saveAnnale('${id}')`,'pink')}</div><p class="muted">Les textes et fichiers audio restent locaux et ne sont pas envoyés à un serveur.</p></div>`}
function saveAnnale(id){let a=annales2018.find(x=>x.id===id),t=$('#annaleText').value.trim(),f=$('#annaleAudio').files[0];if(!t)return toast('Colle d’abord le texte de l’annale.');if(f&&f.size>3000000)return toast('Audio trop volumineux (maximum 3 Mo).');let d=state.custom.find(x=>x.annaleId===id);if(!d){d={id:'annale-'+id,annaleId:id};state.custom.push(d)}Object.assign(d,{title:'Brevet 2018 — '+a.title,level:'3e',topic:'Brevet',text:t,explain:a.focus,source:a.code,notes:a.notes});function done(){save();mode='classic';startDict(d.id);toast('Annale enregistrée localement.')}if(f){let r=new FileReader();r.onload=()=>{d.audio=r.result;done()};r.readAsDataURL(f)}else done()}
function teacher(){return `<section class="hero"><h1>Studio professeur</h1><p>Crée tes dictées, choisis une voix et partage tes contenus par export JSON.</p></section><div class="twocol" style="margin-top:20px"><div class="card"><h2>Créer une dictée</h2><label class="label">Titre</label><input id="tTitle" class="field" placeholder="Ex. La forêt mystérieuse"><label class="label">Classe</label><select id="tLevel" class="field">${['6e','5e','4e','3e'].map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select><label class="label">Compétence dominante</label><select id="tTopic" class="field">${['Accords','Conjugaison','Homophones','Lexique','Ponctuation','Brevet'].map(x=>`<option>${x}</option>`).join('')}</select><label class="label">Texte de la dictée</label><textarea id="tText" class="field" placeholder="Saisis le texte complet…"></textarea><label class="label">Conseil pédagogique</label><textarea id="tExplain" class="field" style="min-height:80px" placeholder="Règle à revoir…"></textarea><label class="label">Audio enregistré (facultatif, MP3, WAV, M4A…)</label><input type="file" id="tAudio" class="field" accept="audio/*"><p class="muted">Sans fichier audio, l’application utilisera la synthèse vocale française.</p><div class="btnrow">${button('Enregistrer la dictée','addDict()')}${button('Tester la voix',"speak($('#tText').value||'Bienvenue dans Dictéo Pop !')",'alt')}</div></div><div class="card"><h2>Ma bibliothèque</h2><p class="muted">${state.custom.length} dictée(s) personnalisée(s) · ${built.length} dictées de démonstration</p>${state.custom.map(d=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${esc(d.title)}</b><p class="muted">${esc(d.level)} · ${esc(d.topic)}</p><div class="btnrow">${button('Essayer',`mode='classic';startDict('${d.id}')`,'alt small')}${button('Supprimer',`deleteDict('${d.id}')`,'alt small')}</div></div>`).join('')}<h3>Sauvegardes et partage</h3><div class="btnrow">${button('Exporter JSON','exportData()','alt')}${button('Importer JSON',"$('#teacherImport').click()",'alt')}<input type="file" id="teacherImport" class="hidden" accept=".json,application/json" onchange="importData(this.files[0])"></div><p class="muted">Les dictées et fichiers audio importés sont stockés localement. Les enregistrements longs peuvent dépasser la capacité de stockage du navigateur : conserve des exports réguliers.</p></div></div>`}
function addDict(){let title=$('#tTitle').value.trim(),text=$('#tText').value.trim();if(!title||!text)return toast('Indique un titre et un texte.');let file=$('#tAudio').files[0];if(file&&file.size>3e6)return toast('Audio trop volumineux (maximum 3 Mo dans cette version).');let d={id:'custom-'+Date.now(),title,level:$('#tLevel').value,topic:$('#tTopic').value,text,explain:$('#tExplain').value.trim()};function done(){state.custom.push(d);save();toast('Dictée enregistrée !');render()}if(file){let reader=new FileReader();reader.onload=()=>{d.audio=reader.result;done()};reader.readAsDataURL(file)}else done()}function deleteDict(id){if(!confirm('Supprimer cette dictée personnalisée ?'))return;state.custom=state.custom.filter(x=>x.id!==id);save();render()}function exportData(){let blob=new Blob([JSON.stringify({app:'DICTEO_POP',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='dicteopop-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(data.app!=='DICTEO_POP'||!data.data||!Array.isArray(data.data.history)||!Array.isArray(data.data.custom))throw Error();if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;state={...state,...data.data};save();render();toast('Sauvegarde importée.')}catch{toast('Fichier de sauvegarde invalide.')}};r.readAsText(file)}render();
</script></body></html>
